function openGameDialog(id,title,body,reason,onAction){
 if(document.querySelector('dialog[open]'))return;
 pauseGame(reason);
 const dialog=document.createElement('dialog');dialog.id=id;dialog.className='quit-dialog settings-dialog';dialog.setAttribute('aria-labelledby',id+'Title');

 dialog.addEventListener('cancel',event=>{event.preventDefault();dialog.close('cancel')});
 dialog.addEventListener('close',()=>{const action=dialog.returnValue;dialog.remove();onAction?.(action);resumeGame(reason)},{once:true});
 dialog.showModal();return dialog;
}

function measureRevealBoard(){
 const board=$('rxStage')?.querySelector('.rx-board');if(!board)return;
 const origin=board.getBoundingClientRect();revealGeometry=roundAwards().map((a,i)=>{const from=board.querySelector(`[data-award="${i}"] .rx-token`).getBoundingClientRect(),to=board.querySelector(`[data-player="${a.owner}"] .rx-total`).getBoundingClientRect();return {x0:from.left+from.width/2-origin.left-16,y0:from.top+from.height/2-origin.top-16,x1:to.left+to.width/2-origin.left-16,y1:to.top+to.height/2-origin.top-16}});
}
function updateRevealBoard(scene,time){
 const board=$('rxStage').querySelector('.rx-board');if(!revealGeometry)measureRevealBoard();
 const before=roundBase(),oldOrder=scoreOrder(before),finalOrder=[...oldOrder].sort((a,b)=>state.scores[b]-state.scores[a]||oldOrder.indexOf(a)-oldOrder.indexOf(b));
 const clamp=n=>Math.max(0,Math.min(1,n)),ease=p=>1-Math.pow(1-p,3),motion=revealReducedMotion(),p=clamp((time-scene.gatherEnd)/950),move=motion?(p>0?1:0):ease(p);
 const arrived=scene.awards.filter((_,i)=>time>=550+i*620+510);
 scene.awards.forEach((a,i)=>{
  const start=550+i*620,progress=clamp((time-start)/510),active=time>=start&&progress<1,flight=board.querySelector('.rx-flight-'+i),pos=revealGeometry?.[i];
  board.querySelector(`[data-award="${i}"]`).classList.toggle('spent',time>=start);
  flight.style.display=active&&!motion&&pos?'grid':'none';
  if(active&&pos){const t=ease(progress);flight.style.transform=`translate(${pos.x0+(pos.x1-pos.x0)*t}px,${pos.y0+(pos.y1-pos.y0)*t-50*Math.sin(Math.PI*progress)}px) scale(${1+.16*Math.sin(Math.PI*progress)})`}
 });
 state.players.forEach((_,i)=>{
  const row=board.querySelector(`[data-player="${i}"]`),own=arrived.filter(a=>a.owner===i),old=oldOrder.indexOf(i),next=finalOrder.indexOf(i);
  row.style.transform=`translateY(${(old+(next-old)*move)*76}px)`;setRevealText(row.querySelector('.rx-total'),before[i]+own.length);
  setRevealText(row.querySelector('.rx-rank'),move>.5?competitionRank(state.scores[i],state.scores):competitionRank(before[i],before));
  const earned=row.querySelector('.rx-row-earned'),key=own.map(a=>a.type).join(',');
  if(earned.dataset.points!==key){earned.dataset.points=key;earned.innerHTML=own.map(a=>a.type==='mask'?maskToken('rx-earned-token'):truthToken('rx-earned-token')).join('')}
  row.classList.toggle('rx-leader',move>.5&&state.scores[i]===Math.max(...state.scores));
  const latest=scene.awards.flatMap((a,k)=>a.owner===i&&time>=550+k*620+510?[550+k*620+510]:[]).pop();const burst=latest===undefined?1:clamp((time-latest)/330);
  row.querySelector('.rx-total').style.transform=motion?'none':`scale(${1+.2*Math.sin(Math.PI*burst)})`;
 });
 const result=board.querySelector('.rx-board-result');result.style.opacity=time>=scene.duration?'1':String(clamp((time-scene.gatherEnd-800)/350));
 const leaders=state.players.filter((_,i)=>state.scores[i]===Math.max(...state.scores));setRevealText(result,leaders.length===1?`${leaders[0]} leads on ${Math.max(...state.scores)}.`:`A shared lead: ${leaders.join(' & ')}.`);
 setRevealText($('rxStatus'),time<550?'The masks and ticks you earned are ready to bank.':time<scene.gatherEnd?'Each mask and tick goes to its owner. Every one adds one point.':time<scene.gatherEnd+950?'Now the leaderboard moves into its new order…':'All points banked. The room may now react.');
}

function openingFrame(d,time,reduced=false){
 const clamp=n=>Math.max(0,Math.min(1,n));
 d.querySelectorAll('.startup-letter').forEach((letter,i)=>{const p=reduced?1:clamp((time-OPENING_TIMING.voiceOnsetMs-i*55)/70);letter.style.opacity=String(p);letter.style.transform='none'});
 const mask=clamp((time-OPENING_TIMING.maskAtMs)/170);d.querySelector('.startup-mask').style.opacity=String(mask);d.querySelector('.startup-mask').style.transform='none';
 d.querySelector('.startup-eye').setAttribute('opacity',!reduced&&time<OPENING_TIMING.winkAtMs?'1':'0');
}
async function startStartup(){
 const d=$('startupDialog');if(!d||d.dataset.started)return;d.dataset.started='true';const token=++startupToken;
 ensureAudio();await Promise.race([prepareSfx()||Promise.resolve(),new Promise(resolve=>setTimeout(resolve,500))]);
 if(token!==startupToken||!$('startupDialog'))return;
 openingFrame(d,0,revealReducedMotion());const brand=playVocal('brand');d.dataset.brandPlayed=String(Boolean(brand));if(brand)startupSources.push(brand);
 const began=performance.now();let winked=false;
 const frame=now=>{if(token!==startupToken||!$('startupDialog'))return;const t=now-began;openingFrame(d,t,revealReducedMotion());if(t>=OPENING_TIMING.winkAtMs&&!winked){winked=true;const wink=playVocal('wink');d.dataset.winkPlayed=String(Boolean(wink));if(wink)startupSources.push(wink)}if(t>=OPENING_TIMING.endAtMs){finishStartup();return}startupFrame=requestAnimationFrame(frame)};
 startupFrame=requestAnimationFrame(frame);
}

async function unlockStartupAudio(){
 const d=$('startupDialog');if(!d||d.dataset.brandPlayed==='true'||d.dataset.unlocking||!audioPrefs.effects)return;
 d.dataset.unlocking='true';ensureAudio();try{await audioCtx?.resume()}catch(e){delete d.dataset.unlocking;return}
 if(!$('startupDialog')||audioCtx?.state!=='running'){delete d.dataset.unlocking;return}
 cancelAnimationFrame(startupFrame);startupFrame=null;startupToken++;
 startupSources.forEach(s=>{try{s.stop()}catch(e){}});startupSources=[];
 delete d.dataset.started;delete d.dataset.unlocking;startStartup();
}

function finishStartup(){startupToken++;cancelAnimationFrame(startupFrame);startupFrame=null;startupSources.forEach(s=>{try{s.stop()}catch(e){}});startupSources=[];const d=$('startupDialog');if(d){if(d._startWhenVisible)document.removeEventListener('visibilitychange',d._startWhenVisible);d.close();d.remove()}startupActive=false;syncMusic()}

// BLUFFLE! audio: synthesized effects plus the approved bundled music loop.
const AUDIO_KEY='bluffle_audio_v1';
let audioPrefs={music:true,effects:true};
try{audioPrefs={...audioPrefs,...JSON.parse(localStorage.getItem(AUDIO_KEY)||'{}')}}catch(e){}
let audioCtx=null,musicLoop=null;
function ensureAudio(){
 try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=new C();audioCtx.addEventListener('statechange',syncMusic)}
 prepareSfx();
 if(audioCtx.state==='suspended')audioCtx.resume().then(syncMusic).catch(()=>{});
 else syncMusic();
 }catch(e){console.warn('Audio unavailable',e)}
}
function tone(freq,duration=0.14,type='sine',volume=.06,delay=0){
 if(!audioCtx||audioCtx.state!=='running')return;
 const t=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);
 gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.015);
 gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
 osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+duration+.02);
}
function effect(name){if(!audioPrefs.effects)return;ensureAudio();
 if(name==='tap')tone(560,.065,'sine',.025);
 if(name==='lock'){tone(470,.11,'triangle',.07);tone(700,.14,'triangle',.06,.1)}
 if(name==='reveal'){[392,494,587,784].forEach((f,i)=>tone(f,.28,'triangle',.075,i*.105))}
 if(name==='win'){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.085,i*.15))}
 if(name==='handoff'){tone(440,.09,'sine',.035);tone(330,.12,'sine',.03,.1)}
}
// BLUFFLE! approved 108 BPM arrangement; bundled locally for website and iOS.
const MUSIC_URL='assets/music/bluffle-enhanced-v2.wav?v=music2';
const MUSIC_VOLUME=.18;
let musicBuffer=null,musicLoad=null,musicGain=null,musicOffset=0,musicStartedAt=0;
function musicWanted(){return audioPrefs.music&&!startupActive&&!document.hidden&&audioCtx&&audioCtx.state==='running'}
function stopMusic(){
 if(!musicLoop)return;
 const source=musicLoop,gain=musicGain;
 if(musicBuffer)musicOffset=(musicOffset+Math.max(0,audioCtx.currentTime-musicStartedAt))%musicBuffer.duration;
 musicLoop=null;musicGain=null;
 const now=audioCtx.currentTime;
 gain.gain.cancelScheduledValues(now);
 gain.gain.setValueAtTime(gain.gain.value,now);
 gain.gain.linearRampToValueAtTime(0,now+.04);
 source.stop(now+.05);
 source.onended=()=>{source.disconnect();gain.disconnect()};
}
function startMusic(){
 if(!musicWanted()||musicLoop||!musicBuffer)return;
 const source=audioCtx.createBufferSource(),gain=audioCtx.createGain();
 source.buffer=musicBuffer;source.loop=true;
 gain.gain.setValueAtTime(0,audioCtx.currentTime);
 gain.gain.linearRampToValueAtTime(currentMusicVolume(),audioCtx.currentTime+.12);
 source.connect(gain);gain.connect(audioCtx.destination);
 musicStartedAt=audioCtx.currentTime;
 source.start(musicStartedAt,musicOffset%musicBuffer.duration);
 musicLoop=source;musicGain=gain;
}
function syncMusic(){
 if(!musicWanted()){stopMusic();return}
 if(musicLoop)return;
 if(musicBuffer){startMusic();return}
 // Share one request while loading. Re-check preferences before starting so a
 // slow response cannot start music after it was switched off or hidden.
 if(musicLoad)return;
 musicLoad=fetch(MUSIC_URL).then(response=>{
  if(!response.ok)throw Error('Music file returned HTTP '+response.status);
  return response.arrayBuffer();
 }).then(data=>audioCtx.decodeAudioData(data)).then(buffer=>{
  musicBuffer=buffer;musicLoad=null;startMusic();
 }).catch(error=>{
  musicLoad=null;
  console.warn('Background music unavailable:',error.message);
  const status=document.getElementById('audioStatus');
  if(status&&audioPrefs.music)status.textContent='Music could not load. Switch music off and on to retry. Sound effects are still available.';
 });
}

function setAudioPref(kind,enabled){audioPrefs[kind]=Boolean(enabled);
 try{localStorage.setItem(AUDIO_KEY,JSON.stringify(audioPrefs))}catch(e){}
 if(enabled)ensureAudio();syncMusic();
 const status=document.getElementById('audioStatus');if(status)status.textContent='Your sound preferences are saved on this device.';
}
// Browsers require a user gesture before audio may play. Never autoplay on load.
document.addEventListener('click',e=>{
 if(!e.target.closest('button')||e.target.closest('#startupDialog'))return;
 const first=!audioCtx;ensureAudio();if(first)syncMusic();
 if(e.target.closest('[data-reveal-control]'))return;
 const label=(e.target.closest('button').textContent||'').toLowerCase();
 if(label.includes('reveal')||label.includes('unmask')||label.includes('next bluff'))effect('reveal');
 else if(label.includes('winner')||label.includes('results'))effect('win');
 else if(label.includes('lock in'))effect('lock');
 else effect('tap');
},true);
document.addEventListener('visibilitychange',syncMusic);
window.addEventListener('pagehide',stopMusic);
window.addEventListener('pageshow',syncMusic);
function audioSettingsHtml(){return `<div class="audio-settings"><h3>🎵 Sound & music</h3><label class="audio-toggle"><span>Background music</span><input type="checkbox" ${audioPrefs.music?'checked':''} onchange="setAudioPref('music',this.checked)"></label><label class="audio-toggle"><span>Sound effects</span><input type="checkbox" ${audioPrefs.effects?'checked':''} onchange="setAudioPref('effects',this.checked)"></label><p id="audioStatus" class="help">Music starts after your first tap. Settings are remembered on this device.</p></div>`}

recoverSession();render();openStartup();
</script></body></html>
