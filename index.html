 span{background:#74529d;border-radius:99px;padding:7px 10px;font-weight:800;font-size:13px}.reveal-points{font-size:36px;font-weight:1000;color:#ffce4d;text-align:center;margin:12px 0}.reveal-meter{display:flex;gap:5px;margin:12px 0}.reveal-meter span{height:6px;background:#ffffff38;border-radius:9px;flex:1}.reveal-meter span.done{background:#ffd65e}@keyframes popin{from{opacity:0;transform:scale(.86) translateY(15px)}to{opacity:1;transform:scale(1) translateY(0)}}@media(prefers-reduced-motion:reduce){.reveal-pop{animation:none}}
.premium-overlay{position:fixed;inset:0;background:#0a0618d9;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}.premium-dialog{width:min(100%,480px);max-height:90dvh;overflow:auto}.premium-dialog h2{font-size:27px}.premium-dialog .hero{font-size:32px}button:focus-visible,input:focus-visible{outline:3px solid #ffe07a;outline-offset:2px}.hintbox{background:#fff0bc;color:#38244e;border-radius:14px;padding:14px;margin:12px 0;line-height:1.5}.hintbox p{margin:8px 0}.age-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.age-item{font-size:13px;color:#e6d7ff}.age-item .input{margin-top:3px}button[hidden]{display:none}</style></head><body><main id="app" class="app" aria-live="polite"></main>
<script>

const JUNIOR_BANK=[
['Animals','What is a group of flamingos called?','A flamboyance','Flamingos can gather in large flocks.','A group of animals can have a special name. Invent a fancy name for lots of pink birds together.'],
['Animals','What is a baby echidna called?','A puggle','An echidna is a spiny, egg-laying mammal.','An echidna is a small animal covered in spines. Make up a cute name for its baby.'],

['Animals','What is a baby kangaroo called?','A joey','The young kangaroo develops in its mother’s pouch.','A kangaroo carries its baby in a pouch. What might that baby be called?'],

['Odd Words','What is a zarf?','A holder for a hot cup','A cup holder used especially with handleless cups.','This unusual word describes an object. Invent what it might do.'],
['Odd Words','What does petrichor mean?','The earthy smell after rain','The term was coined in the 1960s.','Think of something you can smell, hear, or feel outdoors. Invent a meaning.'],
['Science','What is the name for a scientist who studies insects?','Entomologist','Entomology is the study of insects.','Insects are bugs like beetles and ants. Make up a job title for someone who studies them.'],
['Nature','What is the biggest type of penguin?','Emperor penguin','Emperor penguins are the largest living penguins.','Penguins come in different kinds. Invent a grand-sounding name for the biggest.'],
['Food','What is the Italian name for ice cream?','Gelato','Gelato is the Italian word for ice cream.','This asks for the word people in Italy use. Invent an Italian-sounding name.'],
['Space','What is the name of the galaxy containing Earth?','The Milky Way','Our solar system is part of the Milky Way.','A galaxy is a huge collection of stars. Invent a name for ours.'],
['Nature','What is a group of owls traditionally called?','A parliament','A traditional collective noun for owls.','Imagine lots of owls sitting together. What unusual name could they have?'],
['Odd Words','What is a pangram?','A sentence using every letter of the alphabet','One example is “The quick brown fox jumps over the lazy dog.”','This is a special type of sentence. Invent what makes it special.'],
['Nature','What is a group of jellyfish sometimes called?','A smack','Smack is one of several collective nouns used for jellyfish.','A group of sea creatures can have a funny name. Invent one for jellyfish.'],
['Science','What is the name for a cloud close to the ground?','Fog','Fog is a cloud of tiny water droplets near ground level.','Imagine a cloud so low you can walk through it. What is it called?']
];
const FAMILY_BANK=[
['Films','What is the name of the cowboy toy in Toy Story?','Woody','Woody is a pull-string cowboy doll.','Toy Story is about toys that come to life. Invent a cowboy-style name.'],
['Films','What is the name of the snowman in Frozen?','Olaf','Olaf is the friendly snowman.','Frozen has a talking snowman. Invent a short, funny name for him.'],
['Nature','What is a group of flamingos called?','A flamboyance','A collective noun used for flamingos.','Animal groups sometimes have surprising names. Invent one for flamingos.'],
['Odd Words','What is an octothorpe?','The # symbol','Another name for the hash or number sign.','This is a strange name for something you may have seen. Invent what it is.'],
['Geography','What is the capital city of Iceland?','Reykjavík','Reykjavík is Iceland’s capital.','A capital is a country’s main city. Invent a place name that sounds Icelandic.'],
['Science','What is the chemical symbol for gold?','Au','The symbol comes from the Latin aurum.','Elements use one- or two-letter symbols. Invent one for gold.'],
['Animals','What is a baby platypus sometimes called?','A puggle','Puggle is an informal name for a baby platypus.','A platypus is an unusual Australian animal. Invent a name for its baby.'],
['Food','What is the Japanese word for a lunch box meal?','Bento','Bento is a packed meal often served in a compartmented box.','This is a Japanese name for food packed in a box. Invent a short word.'],
['Books','What is the name of Harry Potter’s pet owl?','Hedwig','Hedwig is Harry Potter’s snowy owl.','Harry Potter has a pet owl. Invent a magical-sounding name for it.'],
['Nature','What is the study of fungi called?','Mycology','Mycology studies mushrooms, moulds and other fungi.','Fungi include mushrooms. Invent a scientific-sounding word for studying them.'],
['History','What was New York City called when it was a Dutch colony?','New Amsterdam','The city was renamed by the English in 1664.','Cities can change names. Invent an old-fashioned European-sounding name.'],
['Odd Words','What does defenestration mean?','Throwing something out of a window','The word comes from Latin for window.','This is an unusual word for an action. Invent a dramatic meaning.']
];
const $=id=>document.getElementById(id), app=$('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={screen:'home',players:['Player 1','Player 2','Player 3','Player 4'],rounds:5,round:0,deck:[],answers:[],votes:[],turn:0,selected:-1,scores:[],error:'',stage:'answer',current:null,revealStep:0,mode:'auto',ages:[35,35,10,7],timerSeconds:0,littleHelp:'optional',hintOpen:false,deadline:null};
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function shell(content){app.innerHTML=`<header class="top"><div class="brand">BLUFFLE!</div><div class="pill">${state.screen==='home'||state.screen==='setup'?'🎉 FAMILY EDITION':`ROUND ${state.round+1} / ${state.rounds}`}</div></header>${content}<footer class="footer">BLUFFLE! · Make it up. Make them believe it.</footer>`;saveSession()}
function home(){shell(`<section class="card"><div class="emoji">🎭</div><h1 class="hero">Can you <span class="accent">pull it off?</span></h1><p class="subtitle">Make up a convincing answer. Fool your family. Spot the truth. Every player you fool earns you a point!</p><button class="btn" onclick="setup()">LET'S PLAY →</button><p class="help">Pass one phone or tablet around. Each player writes a secret bluff, then everyone votes privately. No internet connection needed once this page is saved.</p></section>`)}
function setup(){state.screen='setup';render()}
function addPlayer(){if(state.players.length>=10)return;state.players.push(`Player ${state.players.length+1}`);state.ages.push(10);render()}
function removePlayer(i){if(state.players.length<=3)return;state.players.splice(i,1);state.ages.splice(i,1);render()}
function updatePlayer(i,v){state.players[i]=v}
function updateAge(i,v){state.ages[i]=Number(v)}
function poolForMode(){const m=state.mode==='auto'?(Math.min(...state.ages)<=8?'junior':Math.min(...state.ages)<=12?'family':'classic'):state.mode;return m==='junior'?JUNIOR_BANK:m==='family'?[...JUNIOR_BANK,...FAMILY_BANK]:BANK.slice(0,20)}
function setGameSetting(k,v){state[k]=v;saveSession()}
function startAnswer(){state.screen='answer';state.hintOpen=state.littleHelp==='always';state.deadline=state.timerSeconds?Date.now()+state.timerSeconds*1000:null;render();tickTimer()}
let timerHandle=null;function tickTimer(){clearInterval(timerHandle);if(state.screen!=='answer'||!state.deadline)return;const update=()=>{if(state.screen!=='answer'){clearInterval(timerHandle);return}const left=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));const el=$('timeLeft');if(el)el.textContent=left+'s';if(left===0){clearInterval(timerHandle);const field=$('answer');if(field&&field.value.trim().length>=2)answerSubmit();else{state.deadline=null;const err=$('err');if(err)err.textContent='Time is up! Submit a bluff or choose Skip.';const skip=$('skipAnswer');if(skip)skip.hidden=false;}}};update();if(state.deadline)timerHandle=setInterval(update,250)}
function skipAnswer(){const field=$('answer');if(!field)return;field.value='A mystery surprise '+(state.turn+1);answerSubmit()}
function toggleHint(){const field=$('answer');const value=field?field.value:'';state.hintOpen=!state.hintOpen;render();if($('answer'))$('answer').value=value;tickTimer()}
function start(){let names=state.players.map(x=>x.trim());if(names.some(x=>!x)||new Set(names.map(x=>x.toLowerCase())).size!==names.length){state.error='Please give every player a unique name.';render();return}state.players=names;state.scores=names.map(()=>0);state.round=0;state.deck=shuffle(poolForMode()).slice(0,state.rounds);nextRound()}
function nextRound(){state.current=state.deck[state.round];state.answers=Array(state.players.length).fill('');state.votes=Array(state.players.length).fill(-1);state.turn=0;state.stage='answer';state.screen='handoff';state.error='';state.deadline=null;render()}
function answerSubmit(){const val=$('answer').value.trim();if(val.length<2){$('err').textContent='Please enter an answer.';return}if(val.length>110){$('err').textContent='Keep your answer under 110 characters.';return}if(val.toLowerCase().replace(/[^a-z0-9]/g,'')===state.current[2].toLowerCase().replace(/[^a-z0-9]/g,'')){$('err').textContent='That is the actual answer! Invent a different bluff.';return}if(state.answers.some(a=>a.toLowerCase()===val.toLowerCase())){$('err').textContent='Someone has already submitted that answer. Try another.';return}clearInterval(timerHandle);state.deadline=null;state.answers[state.turn]=val;state.turn++;if(state.turn>=state.players.length){state.screen='voteIntro';state.options=shuffle([...state.answers.map((text,owner)=>({text,owner})),{text:state.current[2],owner:-1}]);state.turn=0;state.stage='vote'}else state.screen='handoff';render()}
function voteSubmit(){if(state.selected<0)return;const o=state.options[state.selected];if(o.owner===state.turn){state.error='You cannot vote for your own answer.';render();return}state.votes[state.turn]=state.selected;state.turn++;state.selected=-1;state.error='';if(state.turn>=state.players.length){calculate();state.screen='reveal';state.revealStep=0}else state.screen='handoff';render()}
function calculate(){state.gains=state.players.map(()=>0);state.votes.forEach((v,i)=>{const owner=state.options[v].owner;if(owner===-1)state.gains[i]++;else state.gains[owner]++});state.gains.forEach((g,i)=>state.scores[i]+=g)}
function advance(){state.round++;if(state.round>=state.rounds)state.screen='final';else{nextRound();return}render()}
function render(){const s=state;switch(s.screen){
case 'home':home();break;
case 'setup':shell(`<section class="card"><span class="tag">GAME SETUP</span><h1 class="hero">Who's <span class="accent">bluffing?</span></h1><p class="muted">3–10 players. Add everyone's name.</p>${s.players.map((p,i)=>`<div class="row player"><span>🎭</span><input aria-label="Player ${i+1} name" class="input" maxlength="24" value="${esc(p)}" oninput="updatePlayer(${i},this.value)"><button class="btn secondary small" aria-label="Remove player ${i+1}" onclick="removePlayer(${i})" ${s.players.length<=3?'disabled':''}>✕</button></div>`).join('')}<button class="btn secondary" onclick="addPlayer()" ${s.players.length>=10?'disabled':''}>+ ADD PLAYER</button><p class="muted">Player ages (used for automatic difficulty)</p><div class="age-grid">${s.players.map((p,i)=>`<label class="age-item">${esc(p)}<select class="input" onchange="updateAge(${i},this.value)">${[7,8,9,10,11,12,13,14,16,18,25,35,45,60].map(n=>`<option value="${n}" ${Number(s.ages[i]||10)===n?'selected':''}>${n}${n===60?'+':''}</option>`).join('')}</select></label>`).join('')}</div><p class="muted">Question mode</p><select class="input" onchange="setGameSetting('mode',this.value)">${[['auto','Automatic (youngest player)'],['junior','Junior (7+)'],['family','Family (10+)'],['classic','Classic (14+)']].map(([v,l])=>`<option value="${v}" ${s.mode===v?'selected':''}>${l}</option>`).join('')}</select><p class="muted">Answer time limit</p><select class="input" onchange="setGameSetting('timerSeconds',Number(this.value))">${[[0,'Off (default)'],[30,'30 seconds'],[60,'60 seconds'],[90,'90 seconds'],[120,'2 minutes']].map(([v,l])=>`<option value="${v}" ${s.timerSeconds===v?'selected':''}>${l}</option>`).join('')}</select><p class="muted">Little Bluffer Help</p><select class="input" onchange="setGameSetting('littleHelp',this.value)">${[['optional','Optional (default)'],['always','Always show'],['off','Off']].map(([v,l])=>`<option value="${v}" ${s.littleHelp===v?'selected':''}>${l}</option>`).join('')}</select><p class="muted">Number of rounds</p><select class="input" onchange="state.rounds=Number(this.value)">${[5,10,15].map(n=>`<option value="${n}" ${n===s.rounds?'selected':''}>${n} rounds</option>`).join('')}</select><div class="error">${esc(s.error)}</div><button class="btn" onclick="start()">START GAME →</button></section>`);break;
case 'handoff':shell(`<section class="card"><span class="tag">${s.stage==='answer'?'SECRET ANSWER':'SECRET VOTE'}</span><div class="emoji">📱</div><h1 class="hero">Pass to <span class="accent">${esc(s.players[s.turn])}</span></h1><p class="subtitle">${s.stage==='answer'?'Only '+esc(s.players[s.turn])+' should see the next screen. Think of a convincing fake answer.':'Only '+esc(s.players[s.turn])+' should see the voting screen. No peeking!'}</p><div class="progress">${s.players.map((_,i)=>`<span class="${i<s.turn?'done':''}"></span>`).join('')}</div><button class="btn" onclick="${s.stage==='answer'?'startAnswer()':"state.screen='vote';render()"}">I'M ${esc(s.players[s.turn]).toUpperCase()} — READY →</button></section>`);break;
case 'answer':shell(`<section class="card"><span class="tag">${esc(s.current[0])} · PLAYER ${s.turn+1}/${s.players.length}</span><div class="question">${esc(s.current[1])}</div><p class="subtitle">${esc(s.players[s.turn])}, make up something that sounds real!</p>${s.timerSeconds&&s.deadline?`<div class="pill">⏱️ Time remaining: <span id="timeLeft">${Math.max(0,Math.ceil((s.deadline-Date.now())/1000))}s</span></div>`:''}${s.littleHelp!=='off'?`<button type="button" class="btn secondary" onclick="toggleHint()">💡 ${s.hintOpen?'HIDE HELP':'LITTLE BLUFFER HELP'}</button>${s.hintOpen?`<div class="hintbox"><strong>What does this mean?</strong><p>${esc(s.current[4]||'Think of an answer that sounds believable, even if you do not know the real one.')}</p><small>Make up your own answer — the real answer stays secret!</small></div>`:''}`:''}<form onsubmit="event.preventDefault();answerSubmit()"><input id="answer" class="input" autocomplete="off" autocapitalize="sentences" maxlength="110" placeholder="Your brilliant fake answer..." aria-label="Your fake answer"><div id="err" class="error"></div><button type="submit" class="btn">LOCK IN MY BLUFF 🔒</button><button type="button" id="skipAnswer" class="btn secondary" hidden onclick="skipAnswer()">SKIP THIS ANSWER</button></form><p class="help">Your answer will be hidden as soon as you submit it.</p></section>`);break;
case 'voteIntro':shell(`<section class="card"><div class="emoji">🗳️</div><h1 class="hero">The bluffs <span class="accent">are in!</span></h1><p class="subtitle">${s.players.length} fake answers and 1 real answer have been shuffled together. Pass the device around again. Each player secretly votes for the answer they think is true.</p><p class="voteinfo">👀 You cannot vote for your own answer. The app keeps the votes secret until everyone has voted.</p><button class="btn" onclick="state.screen='handoff';render()">START VOTING →</button></section>`);break;
case 'vote':shell(`<section class="card"><span class="tag">${esc(s.current[0])} · VOTER ${s.turn+1}/${s.players.length}</span><div class="question">${esc(s.current[1])}</div><p class="muted">${esc(s.players[s.turn])}, which answer is the real one?</p>${s.options.map((o,i)=>`<button class="option ${s.selected===i?'selected':''}" onclick="state.selected=${i};state.error='';render()" ${o.owner===s.turn?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o.text)}${o.owner===s.turn?' <small>(your answer)</small>':''}</span></button>`).join('')}<div class="error">${esc(s.error)}</div><button class="btn" onclick="voteSubmit()" ${s.selected<0?'disabled':''}>LOCK IN MY VOTE 🔒</button></section>`);break;
case 'reveal':{
 const fakes=s.options.map((o,i)=>({...o,optionIndex:i})).filter(o=>o.owner!==-1);
 const step=s.revealStep||0;
 const total=fakes.length+2;
 let panel='';
 if(step===0){panel=`<div class="emoji reveal-pop">🥁</div><h1 class="hero reveal-pop">The truth is <span class="accent">coming...</span></h1><p class="subtitle">Everyone has voted. Ready to find out who fooled the family?</p><button class="btn" onclick="state.revealStep++;render()">REVEAL THE TRUTH ✨</button>`}
 else if(step===1){panel=`<div class="emoji reveal-pop">🎯</div><span class="tag">THE REAL ANSWER</span><div class="reveal correct reveal-pop reveal-glow"><h2>${esc(s.current[2])}</h2><p>${esc(s.current[3])}</p></div><p class="muted">${s.votes.filter(v=>s.options[v].owner===-1).length} player(s) guessed correctly and earned a point.</p><button class="btn" onclick="state.revealStep++;render()">UNMASK THE BLUFFERS 🎭</button>`}
 else if(step<total){const o=fakes[step-2];const voters=s.votes.map((v,i)=>v===o.optionIndex?s.players[i]:null).filter(Boolean);panel=`<div class="emoji reveal-pop">${voters.length?'🤯':'😅'}</div><span class="tag">BLUFF ${step-1} OF ${fakes.length}</span><div class="reveal reveal-pop reveal-glow"><div class="muted">THE FAKE ANSWER</div><h2>“${esc(o.text)}”</h2></div><div class="reveal-pop"><div class="muted">THE MASTER BLUFFER</div><div class="reveal-owner">🎭 ${esc(s.players[o.owner])}</div><div class="muted">${voters.length?voters.length+' player(s) fell for it:':'Nobody fell for this one!'}</div><div class="reveal-voters">${voters.map(v=>`<span>🗳️ ${esc(v)}</span>`).join('')}</div><div class="reveal-points">+${voters.length} ${voters.length===1?'POINT':'POINTS'}</div></div><button class="btn" onclick="state.revealStep++;render()">${step===total-1?'ROUND RESULTS 🏆':'NEXT BLUFF →'}</button>`}
 else{panel=`<div class="emoji reveal-pop">🏆</div><h1 class="hero">Round <span class="accent">results!</span></h1>${s.players.map((p,i)=>({p,i,g:s.gains[i]})).sort((a,b)=>b.g-a.g).map(x=>`<div class="score"><span>${esc(x.p)}</span><strong>+${x.g}</strong></div>`).join('')}<button class="btn" onclick="state.screen='scores';render()">VIEW OVERALL SCOREBOARD →</button>`}
 shell(`<section class="card"><span class="tag">THE BIG REVEAL</span><div class="reveal-meter">${Array.from({length:total+1},(_,i)=>`<span class="${i<=step?'done':''}"></span>`).join('')}</div><div class="question">${esc(s.current[1])}</div>${panel}</section>`);break}
case 'scores':shell(`<section class="card"><div class="emoji">🏆</div><h1 class="hero">Score<span class="accent">board!</span></h1>${s.players.map((p,i)=>({p,i,score:s.scores[i]})).sort((a,b)=>b.score-a.score).map((x,rank)=>`<div class="score"><span>${['🥇','🥈','🥉'][rank]||'⭐'} ${esc(x.p)}</span><strong>${x.score}</strong></div>`).join('')}<button class="btn" onclick="advance()">${s.round+1===s.rounds?'SEE THE WINNER 🏆':'NEXT ROUND →'}</button></section>`);break;
case 'final':{const max=Math.max(...s.scores),winners=s.players.filter((p,i)=>s.scores[i]===max);shell(`<section class="card"><div class="emoji">🏆🎊</div><span class="tag">GAME OVER</span><h1 class="hero">We have a <span class="accent">winner!</span></h1><div class="winner">${winners.map(esc).join(' & ')}<br><span class="counter">${max} points</span></div>${s.players.map((p,i)=>({p,i,score:s.scores[i]})).sort((a,b)=>b.score-a.score).map((x,rank)=>`<div class="score"><span>${rank+1}. ${esc(x.p)}</span><strong>${x.score}</strong></div>`).join('')}<button class="btn" onclick="state.screen='setup';state.error='';render()">PLAY AGAIN 🔁</button><button class="btn secondary" onclick="state.screen='home';render()">HOME</button></section>`);break}
}}

// Commercial foundation: offline session recovery, premium product boundary and privacy-safe controls.
const SAVE_KEY='bluffle.session.v4';
const PRODUCT_ID='com.bluffle.premium_lifetime';
const FREE_QUESTIONS=JUNIOR_BANK.length+FAMILY_BANK.length+20;
const ENTITLEMENTS={premium:false}; // NEVER set from local storage. Native store verification required.
function saveSession(){
  try { const snapshot={...state,selected:-1};
    // On resume always require a fresh handoff before private content is shown.
    if(['answer','vote'].includes(snapshot.screen)) {snapshot.screen='handoff';snapshot.deadline=null;}
    localStorage.setItem(SAVE_KEY,JSON.stringify(snapshot));
  } catch(e) { console.warn('Local session storage unavailable',e); }
}
function recoverSession(){
  try { const raw=localStorage.getItem(SAVE_KEY); if(!raw)return false;
    const saved=JSON.parse(raw);
    if(!saved||!Array.isArray(saved.players)||!Array.isArray(saved.scores)||!['handoff','voteIntro','reveal','scores','final'].includes(saved.screen))return false;
    if(saved.players.length<3||saved.players.length>10||saved.scores.length!==saved.players.length)return false;if(!Array.isArray(saved.ages)||saved.ages.length!==saved.players.length)return false;
    state={...state,...saved,selected:-1}; return true;
  }catch(e){return false;}
}
function resetSession(){if(!confirm('Erase the current game and start again?'))return;localStorage.removeItem(SAVE_KEY);state={screen:'home',players:['Player 1','Player 2','Player 3','Player 4'],rounds:5,round:0,deck:[],answers:[],votes:[],turn:0,selected:-1,scores:[],error:'',stage:'answer',current:null,revealStep:0,mode:'auto',ages:[35,35,10,7],timerSeconds:0,littleHelp:'optional',hintOpen:false,deadline:null};render()}
function showPremium(){
 const el=document.createElement('div');el.id='premiumOverlay';el.className='premium-overlay';
 el.innerHTML=`<section class="card premium-dialog" role="dialog" aria-modal="true" aria-label="BLUFFLE Premium"><div class="emoji">👑</div><h2 class="hero">BLUFFLE! <span class="accent">Premium</span></h2><p class="subtitle">One-off £3.99 upgrade: no ads, more question packs and future standard question updates.</p><p class="tag">COMING IN THE APP STORE RELEASE</p><p class="help">This browser build is a preview. No payments are taken, no adverts are served, and Premium cannot be activated here.</p><button class="btn" onclick="document.getElementById('premiumOverlay').remove()">GOT IT</button></section>`;
 document.body.appendChild(el);
}
function showAbout(){
 const el=document.createElement('div');el.id='aboutOverlay';el.className='premium-overlay';
 el.innerHTML=`<section class="card premium-dialog" role="dialog" aria-modal="true" aria-label="Game settings"><h2>Settings & privacy</h2><p class="subtitle">This prototype runs locally on your device. Player names, answers and scores are stored in this browser to recover interrupted games. No accounts, tracking or ads are active.</p><p class="muted">Answer timer: off by default. Little Bluffer Help: optional by default. Set these and question mode when starting a game.</p><p class="muted">Free question pool: ${FREE_QUESTIONS} prototype questions. Remaining content requires editorial verification before commercial release.</p><button class="btn pink" onclick="document.getElementById('aboutOverlay').remove();resetSession()">ERASE SAVED GAME</button><button class="btn secondary" onclick="document.getElementById('aboutOverlay').remove()">CLOSE</button></section>`;
 document.body.appendChild(el);
}
const oldHome=home;
home=function(){oldHome();const card=document.querySelector('.card');if(card){card.insertAdjacentHTML('beforeend','<button class="btn pink" onclick="showPremium()">👑 PREMIUM — £3.99 PREVIEW</button><button class="btn secondary" onclick="showAbout()">⚙️ SETTINGS & PRIVACY</button>');}}
const oldRender=render;
render=function(){oldRender();saveSession();};
if(recoverSession())render();else render();
</script></body></html>
