workflows:
  ios-simulator-beta:
    name: BLUFFLE iOS Simulator (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm install --no-audit --no-fund
      - name: Generate native iOS project
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Set minimum iOS version to 15
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          node <<'BLUFFLE_IOS_TARGET'
          const fs = require('node:fs');
          const projectPath = 'ios/App/App.xcodeproj/project.pbxproj';
          const podfilePath = 'ios/App/Podfile';
          const project = fs.readFileSync(projectPath, 'utf8');
          let projectSettings = 0;
          const updatedProject = project.replace(/\bIPHONEOS_DEPLOYMENT_TARGET\s*=\s*"?(\d+(?:\.\d+){0,2})"?\s*;/g, (match, version) => {
            projectSettings++;
            return Number(version.split('.')[0]) < 15 ? 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' : match;
          });
          if (!projectSettings) throw new Error('Could not find the native iOS deployment target.');
          const podfile = fs.readFileSync(podfilePath, 'utf8');
          let podPlatforms = 0;
          const updatedPodfile = podfile.replace(/^(\s*platform\s+:ios\s*,\s*)(['"])(\d+(?:\.\d+){0,2})\2/gm, (match, prefix, quote, version) => {
            podPlatforms++;
            return Number(version.split('.')[0]) < 15 ? prefix + quote + '15.0' + quote : match;
          });
          if (!podPlatforms) throw new Error('Could not find the iOS platform in Podfile.');
          fs.writeFileSync(projectPath, updatedProject);
          fs.writeFileSync(podfilePath, updatedPodfile);
          console.log('Minimum iOS version is at least 15.0 for the app and CocoaPods platform.');
          BLUFFLE_IOS_TARGET

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
      - name: Compile unsigned iOS Simulator app
        script: |
          set -e
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - build/DerivedData/Logs/Build/*.xcactivitylog

  ios-testflight:
    name: BLUFFLE TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: bluffle_apple

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bluffle.game
      node: 22
      xcode: latest

    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm install --no-audit --no-fund

      - name: Generate native iOS project
        script: |
          npx cap add ios
          npx cap sync ios

      - name: Set minimum iOS version to 15
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          node <<'BLUFFLE_IOS_TARGET'
          const fs = require('node:fs');
          const projectPath = 'ios/App/App.xcodeproj/project.pbxproj';
          const podfilePath = 'ios/App/Podfile';
          const project = fs.readFileSync(projectPath, 'utf8');
          let projectSettings = 0;
          const updatedProject = project.replace(/\bIPHONEOS_DEPLOYMENT_TARGET\s*=\s*"?(\d+(?:\.\d+){0,2})"?\s*;/g, (match, version) => {
            projectSettings++;
            return Number(version.split('.')[0]) < 15 ? 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' : match;
          });
          if (!projectSettings) throw new Error('Could not find the native iOS deployment target.');
          const podfile = fs.readFileSync(podfilePath, 'utf8');
          let podPlatforms = 0;
          const updatedPodfile = podfile.replace(/^(\s*platform\s+:ios\s*,\s*)(['"])(\d+(?:\.\d+){0,2})\2/gm, (match, prefix, quote, version) => {
            podPlatforms++;
            return Number(version.split('.')[0]) < 15 ? prefix + quote + '15.0' + quote : match;
          });
          if (!podPlatforms) throw new Error('Could not find the iOS platform in Podfile.');
          fs.writeFileSync(projectPath, updatedProject);
          fs.writeFileSync(podfilePath, updatedPodfile);
          console.log('Minimum iOS version is at least 15.0 for the app and CocoaPods platform.');
          BLUFFLE_IOS_TARGET

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Set a unique Apple build number
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ ! "${PROJECT_BUILD_NUMBER:-}" =~ ^[0-9]+$ ]]; then
            echo "Codemagic PROJECT_BUILD_NUMBER is missing or invalid."
            exit 1
          fi
          BLUFFLE_BUILD_NUMBER=$((10#$PROJECT_BUILD_NUMBER + 1))
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BLUFFLE_BUILD_NUMBER"
          echo "BLUFFLE! App Store build number: $BLUFFLE_BUILD_NUMBER"

      - name: Apply Apple signing profiles
        script: |
          xcode-project use-profiles

      - name: Build signed iOS application
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
