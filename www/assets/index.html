function categoryGroup(category){
 const key=String(category).toLowerCase();
 if(['animals','animal oddities'].includes(key))return 'animals';
 if(['odd words','weird words'].includes(key))return 'words';
 if(['geography','weird geography','strange places'].includes(key))return 'places';
 if(['films','film lines'].includes(key))return 'films';
 if(['books','autobiographies','first words of books','book endings'].includes(key))return 'books';
 if(['science','space'].includes(key))return 'science';
 return key;
}
function makeDeck(pool,count){
 const groups=new Map();
 for(const question of shuffle(pool)){
  const key=categoryGroup(question[0]);
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push(question);
 }
 const deck=[];
 while(deck.length<count&&groups.size){
  for(const key of shuffle([...groups.keys()])){
   if(deck.length>=count)break;
   const group=groups.get(key);deck.push(group.pop());
   if(!group.length)groups.delete(key);
  }
 }
 return deck;
}

function updateCountdown(left){
 const timer=$('answerTimer'),clock=$('timeLeft'),cue=$('lastSeconds'),number=$('lastSecondsNumber');
 if(clock&&clock.textContent!==left+'s')clock.textContent=left+'s';
 if(timer)timer.classList.toggle('urgent',left>0&&left<=10);
 if(cue){cue.hidden=!(left>0&&left<=10);if(number&&number.textContent!==String(left))number.textContent=String(left);}
}
function tickTimer(){
 clearInterval(timerHandle);timerHandle=null;
 if(state.screen!=='answer'||!state.deadline){updateCountdown(0);return;}
 const update=()=>{
  if(state.screen!=='answer'||!state.deadline){clearInterval(timerHandle);timerHandle=null;updateCountdown(0);return;}
  const left=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));
  updateCountdown(left);
  if(left===0){
   clearInterval(timerHandle);timerHandle=null;state.deadline=null;state.timerExpired=true;
   const field=$('answer');
   if(field&&field.value.trim().length>=2)answerSubmit();
   if(state.screen==='answer'){
    const err=$('err'),skip=$('skipAnswer'),clock=$('timeLeft');
    if(clock)clock.textContent="Time's up!";
    if(err)err.textContent=err.textContent?"Time is up! "+err.textContent:'Time is up! Submit a bluff or choose Skip.';
    if(skip)skip.hidden=false;
    saveSession();
   }
  }
 };
 update();
 if(state.screen==='answer'&&state.deadline)timerHandle=setInterval(update,250);
}

function answerSubmit(){const val=$('answer').value.trim();if(val.length<2){$('err').textContent='Please enter an answer.';return}if(val.length>110){$('err').textContent='Keep your answer under 110 characters.';return}if(val.toLowerCase().replace(/[^a-z0-9]/g,'')===state.current[2].toLowerCase().replace(/[^a-z0-9]/g,'')){$('err').textContent='That is the actual answer! Invent a different bluff.';return}if(state.answers.some(a=>a.toLowerCase()===val.toLowerCase())){$('err').textContent='Someone has already submitted that answer. Try another.';return}clearInterval(timerHandle);state.deadline=null;state.answers[state.turn]=val;state.turn++;if(state.turn>=state.players.length){state.screen='voteIntro';state.options=shuffle([...state.answers.map((text,owner)=>({text,owner})),{text:state.current[2],owner:-1}]);state.turn=0;state.stage='vote'}else state.screen='handoff';render()}

function calculate(){state.gains=state.players.map(()=>0);state.votes.forEach((v,i)=>{const owner=state.options[v].owner;if(owner===-1)state.gains[i]++;else state.gains[owner]++});state.gains.forEach((g,i)=>state.scores[i]+=g)}
function advance(){state.round++;if(state.round>=state.rounds)state.screen='final';else{nextRound();return}render()}
function render(){const s=state;switch(s.screen){
case 'home':home();break;
case 'setup':shell(`<section class="card"><span class="tag">GAME SETUP</span><h1 class="hero">Who's <span class="accent">bluffing?</span></h1><p class="muted">3–10 players. Add everyone's name.</p>${s.players.map((p,i)=>`<div class="row player"><span>🎭</span><input aria-label="Player ${i+1} name" class="input" maxlength="24" value="${esc(p)}" oninput="updatePlayer(${i},this.value)"><button class="btn secondary small" aria-label="Remove player ${i+1}" onclick="removePlayer(${i})" ${s.players.length<=3?'disabled':''}>✕</button></div>`).join('')}<button class="btn secondary" onclick="addPlayer()" ${s.players.length>=10?'disabled':''}>+ ADD PLAYER</button><p class="muted">Player ages (used for automatic difficulty)</p><div class="age-grid">${s.players.map((p,i)=>`<label class="age-item">${esc(p)}<select class="input" onchange="updateAge(${i},this.value)">${[7,8,9,10,11,12,13,14,16,18,25,35,45,60].map(n=>`<option value="${n}" ${Number(s.ages[i]||10)===n?'selected':''}>${n}${n===60?'+':''}</option>`).join('')}</select></label>`).join('')}</div><p class="muted">Question mode</p><select class="input" onchange="setGameSetting('mode',this.value)">${[['auto','Automatic (youngest player)'],['junior','Junior (7+)'],['family','Family (10+)'],['classic','Classic (14+)']].map(([v,l])=>`<option value="${v}" ${s.mode===v?'selected':''}>${l}</option>`).join('')}</select><p class="muted">Answer time limit</p><select class="input" onchange="setGameSetting('timerSeconds',Number(this.value))">${[[0,'Off (default)'],[30,'30 seconds'],[60,'60 seconds'],[90,'90 seconds'],[120,'2 minutes']].map(([v,l])=>`<option value="${v}" ${s.timerSeconds===v?'selected':''}>${l}</option>`).join('')}</select><p class="muted">💡 Little Bluffer Help is automatically available to players under 10. They can choose whether to open it during their answer turn.</p>${audioSettingsHtml()}<p class="muted">Number of rounds</p><select class="input" onchange="state.rounds=Number(this.value)">${[5,10,15].map(n=>`<option value="${n}" ${n===s.rounds?'selected':''}>${n} rounds</option>`).join('')}</select><div class="error">${esc(s.error)}</div><button class="btn" onclick="start()">START GAME →</button></section>`);break;
case 'handoff':shell(`<section class="card"><span class="tag">${s.stage==='answer'?'SECRET ANSWER':'SECRET VOTE'}</span><div class="emoji">📱</div><h1 class="hero">Pass to <span class="accent">${esc(s.players[s.turn])}</span></h1><p class="subtitle">${s.stage==='answer'?'Only '+esc(s.players[s.turn])+' should see the next screen. Think of a convincing fake answer.':'Only '+esc(s.players[s.turn])+' should see the voting screen. No peeking!'}</p><div class="progress">${s.players.map((_,i)=>`<span class="${i<s.turn?'done':''}"></span>`).join('')}</div><button class="btn" onclick="${s.stage==='answer'?'startAnswer()':"state.screen='vote';render()"}">I'M ${esc(s.players[s.turn]).toUpperCase()} — READY →</button></section>`);break;
case 'answer':shell(`<section class="card"><span class="tag">${esc(s.current[0])} · PLAYER ${s.turn+1}/${s.players.length}</span><div class="question">${esc(s.current[1])}</div><p class="subtitle">${esc(s.players[s.turn])}, make up something that sounds real!</p>${s.timerSeconds&&(s.deadline||s.timerExpired)?`<div id="answerTimer" class="pill answer-timer">⏱️ <span>Time remaining:</span> <span id="timeLeft">${s.deadline?Math.max(0,Math.ceil((s.deadline-Date.now())/1000))+'s':"Time's up!"}</span></div>`:''}<div id="lastSeconds" class="last-seconds" hidden aria-hidden="true"><small>Seconds left</small><strong id="lastSecondsNumber"></strong></div>${isLittleBluffer()?`<button type="button" class="btn secondary" onclick="toggleHint()">💡 ${s.hintOpen?'HIDE HELP':'LITTLE BLUFFER HELP'}</button>${s.hintOpen?`<div class="hintbox"><strong>What does this mean?</strong><p>${esc(s.current[4]||'Think of an answer that sounds believable, even if you do not know the real one.')}</p><small>Make up your own answer — the real answer stays secret!</small></div>`:''}`:''}<form onsubmit="event.preventDefault();answerSubmit()"><input id="answer" class="input" autocomplete="off" autocapitalize="sentences" maxlength="110" placeholder="Your brilliant fake answer..." aria-label="Your fake answer"><div id="err" class="error"></div><button type="submit" class="btn">LOCK IN MY BLUFF 🔒</button><button type="button" id="skipAnswer" class="btn secondary" ${s.timerExpired?'':'hidden'} onclick="skipAnswer()">SKIP THIS ANSWER</button></form><p class="help">Your answer will be hidden as soon as you submit it.</p></section>`);break;
case 'voteIntro':shell(`<section class="card"><div class="emoji">🗳️</div><h1 class="hero">The bluffs <span class="accent">are in!</span></h1><p class="subtitle">${s.players.length} fake answers and 1 real answer have been shuffled together. Pass the device around again. Each player secretly votes for the answer they think is true.</p><p class="voteinfo">👀 You cannot vote for your own answer. The app keeps the votes secret until everyone has voted.</p><button class="btn" onclick="state.screen='handoff';render()">START VOTING →</button></section>`);break;
case 'vote':shell(`<section class="card"><span class="tag">${esc(s.current[0])} · VOTER ${s.turn+1}/${s.players.length}</span><div class="question">${esc(s.current[1])}</div><p class="muted">${esc(s.players[s.turn])}, which answer is the real one?</p>${s.options.map((o,i)=>`<button class="option ${s.selected===i?'selected':''}" onclick="state.selected=${i};state.error='';render()" ${o.owner===s.turn?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(votingText(o.text))}${o.owner===s.turn?' <small>(your answer)</small>':''}</span></button>`).join('')}<div class="error">${esc(s.error)}</div><button class="btn" onclick="voteSubmit()" ${s.selected<0?'disabled':''}>LOCK IN MY VOTE 🔒</button></section>`);break;
case 'reveal':{
 const fakes=s.options.map((o,i)=>({...o,optionIndex:i})).filter(o=>o.owner!==-1);
 const step=s.revealStep||0;
 const total=fakes.length+2;
 let panel='';
 if(step===0){panel=`<div class="emoji reveal-pop">🥁</div><h1 class="hero reveal-pop">The truth is <span class="accent">coming...</span></h1><p class="subtitle">Everyone has voted. Ready to find out who fooled the family?</p><button class="btn" onclick="state.revealStep++;render()">REVEAL THE TRUTH ✨</button>`}
 else if(step===1){panel=`<div class="emoji reveal-pop">🎯</div><span class="tag">THE REAL ANSWER</span><div class="reveal correct reveal-pop reveal-glow"><h2>${esc(s.current[2])}</h2><p>${esc(s.current[3])}</p></div><p class="muted">${s.votes.filter(v=>s.options[v].owner===-1).length} player(s) guessed correctly and earned a point.</p><button class="btn" onclick="state.revealStep++;render()">UNMASK THE BLUFFERS 🎭</button>`}
 else if(step<total){const o=fakes[step-2];const voters=s.votes.map((v,i)=>v===o.optionIndex?s.players[i]:null).filter(Boolean);panel=`<div class="emoji reveal-pop">${voters.length?'🤯':'😅'}</div><span class="tag">BLUFF ${step-1} OF ${fakes.length}</span><div class="reveal reveal-pop reveal-glow"><div class="muted">THE FAKE ANSWER</div><h2>“${esc(o.text)}”</h2></div><div class="reveal-pop"><div class="muted">THE MASTER BLUFFER</div><div class="reveal-owner">🎭 ${esc(s.players[o.owner])}</div><div class="muted">${voters.length?voters.length+' player(s) fell for it:':'Nobody fell for this one!'}</div><div class="reveal-voters">${voters.map(v=>`<span>🗳️ ${esc(v)}</span>`).join('')}</div><div class="reveal-points">+${voters.length} ${voters.length===1?'POINT':'POINTS'}</div></div><button class="btn" onclick="state.revealStep++;render()">${step===total-1?'ROUND RESULTS 🏆':'NEXT BLUFF →'}</button>`}
 else{panel=`<div class="emoji reveal-pop">🏆</div><h1 class="hero">Round <span class="accent">results!</span></h1>${s.players.map((p,i)=>({p,i,g:s.gains[i]})).sort((a,b)=>b.g-a.g).map(x=>`<div class="score"><span>${esc(x.p)}</span><strong>+${x.g}</strong></div>`).join('')}<button class="btn" onclick="state.screen='scores';render()">VIEW OVERALL SCOREBOARD →</button>`}
 shell(`<section class="card"><span class="tag">THE BIG REVEAL</span><div class="reveal-meter">${Array.from({length:total+1},(_,i)=>`<span class="${i<=step?'done':''}"></span>`).join('')}</div><div class="question">${esc(s.current[1])}</div>${panel}</section>`);break}
case 'scores':shell(`<section class="card"><div class="emoji">🏆</div><h1 class="hero">Score<span class="accent">board!</span></h1>${s.players.map((p,i)=>({p,i,score:s.scores[i]})).sort((a,b)=>b.score-a.score).map((x,rank)=>`<div class="score"><span>${['🥇','🥈','🥉'][rank]||'⭐'} ${esc(x.p)}</span><strong>${x.score}</strong></div>`).join('')}<button class="btn" onclick="advance()">${s.round+1===s.rounds?'SEE THE WINNER 🏆':'NEXT ROUND →'}</button></section>`);break;
case 'final':{const max=Math.max(...s.scores),winners=s.players.filter((p,i)=>s.scores[i]===max);shell(`<section class="card"><div class="emoji">🏆🎊</div><span class="tag">GAME OVER</span><h1 class="hero">We have a <span class="accent">winner!</span></h1><div class="winner">${winners.map(esc).join(' & ')}<br><span class="counter">${max} points</span></div>${s.players.map((p,i)=>({p,i,score:s.scores[i]})).sort((a,b)=>b.score-a.score).map((x,rank)=>`<div class="score"><span>${rank+1}. ${esc(x.p)}</span><strong>${x.score}</strong></div>`).join('')}<button class="btn" onclick="state.screen='setup';state.error='';render()">PLAY AGAIN 🔁</button><button class="btn secondary" onclick="state.screen='home';render()">HOME</button></section>`);break}
}}

// Commercial foundation: offline session recovery, premium product boundary and privacy-safe controls.
const SAVE_KEY='bluffle.session.v5.1.freepack1';
const PRODUCT_ID='com.bluffle.premium_lifetime';
const FREE_QUESTIONS=JUNIOR_BANK.length+FAMILY_BANK.length+BANK.length;
const ENTITLEMENTS={premium:false}; // NEVER set from local storage. Native store verification required.
function saveSession(){
  try { const snapshot={...state,selected:-1};
    // On resume always require a fresh handoff before private content is shown.
    if(['answer','vote'].includes(snapshot.screen)) {snapshot.screen='handoff';snapshot.deadline=null;}
    localStorage.setItem(SAVE_KEY,JSON.stringify(snapshot));
  } catch(e) { console.warn('Local session storage unavailable',e); }
}
function recoverSession(){
  try { const raw=localStorage.getItem(SAVE_KEY); if(!raw)return false;
    const saved=JSON.parse(raw);
    if(!saved||!Array.isArray(saved.players)||!Array.isArray(saved.scores)||!['handoff','voteIntro','reveal','scores','final'].includes(saved.screen))return false;
    if(saved.players.length<3||saved.players.length>10||saved.scores.length!==saved.players.length)return false;if(!Array.isArray(saved.ages)||saved.ages.length!==saved.players.length)return false;
    state={...state,...saved,selected:-1}; return true;
  }catch(e){return false;}
}
function resetSession(){if(!confirm('Erase the current game and start again?'))return;localStorage.removeItem(SAVE_KEY);state={screen:'home',players:['Player 1','Player 2','Player 3','Player 4'],rounds:5,round:0,deck:[],answers:[],votes:[],turn:0,selected:-1,scores:[],error:'',stage:'answer',current:null,revealStep:0,mode:'auto',ages:[35,35,10,7],timerSeconds:0,littleHelp:'optional',hintOpen:false,deadline:null};render()}
function showPremium(){
 const el=document.createElement('div');el.id='premiumOverlay';el.className='premium-overlay';
 el.innerHTML=`<section class="card premium-dialog" role="dialog" aria-modal="true" aria-label="BLUFFLE Premium"><div class="emoji">👑</div><h2 class="hero">BLUFFLE! <span class="accent">Premium</span></h2><p class="subtitle">One-off £3.99 upgrade: no ads, more question packs and future standard question updates.</p><p class="tag">COMING IN THE APP STORE RELEASE</p><p class="help">This browser build is a preview. No payments are taken, no adverts are served, and Premium cannot be activated here.</p><button class="btn" onclick="document.getElementById('premiumOverlay').remove()">GOT IT</button></section>`;
 document.body.appendChild(el);
}
function showAbout(){
 const el=document.createElement('div');el.id='aboutOverlay';el.className='premium-overlay';
 el.innerHTML=`<section class="card premium-dialog" role="dialog" aria-modal="true" aria-label="Game settings"><h2>Settings & privacy</h2><p class="subtitle">This prototype runs locally on your device. Player names, answers and scores are stored in this browser to recover interrupted games. No accounts, tracking or ads are active.</p><p class="muted">Answer timer: off by default. Little Bluffer Help: available only to players under 10, who may open it if needed. Set the timer and question mode when starting a game.</p><p class="muted">Free question pool: ${FREE_QUESTIONS} draft questions. Remaining content requires editorial verification before commercial release.</p>${audioSettingsHtml()}<button class="btn pink" onclick="document.getElementById('aboutOverlay').remove();resetSession()">ERASE SAVED GAME</button><button class="btn secondary" onclick="document.getElementById('aboutOverlay').remove()">CLOSE</button></section>`;
 document.body.appendChild(el);
}
// BLUFFLE! audio: synthesized effects plus the approved bundled music loop.
const AUDIO_KEY='bluffle_audio_v1';
let audioPrefs={music:true,effects:true};
try{audioPrefs={...audioPrefs,...JSON.parse(localStorage.getItem(AUDIO_KEY)||'{}')}}catch(e){}
let audioCtx=null,musicLoop=null;
function ensureAudio(){
 try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=new C();audioCtx.addEventListener('statechange',syncMusic)}
 if(audioCtx.state==='suspended')audioCtx.resume().then(syncMusic).catch(()=>{});
 else syncMusic();
 }catch(e){console.warn('Audio unavailable',e)}
}
function tone(freq,duration=0.14,type='sine',volume=.06,delay=0){
 if(!audioCtx||audioCtx.state!=='running')return;
 const t=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);
 gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.015);
 gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
 osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+duration+.02);
}
function effect(name){if(!audioPrefs.effects)return;ensureAudio();
 if(name==='tap')tone(560,.065,'sine',.025);
 if(name==='lock'){tone(470,.11,'triangle',.07);tone(700,.14,'triangle',.06,.1)}
 if(name==='reveal'){[392,494,587,784].forEach((f,i)=>tone(f,.28,'triangle',.075,i*.105))}
 if(name==='win'){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.085,i*.15))}
 if(name==='handoff'){tone(440,.09,'sine',.035);tone(330,.12,'sine',.03,.1)}
}
// BLUFFLE! approved 108 BPM arrangement; bundled locally for website and iOS.
const MUSIC_URL='assets/music/bluffle-enhanced-v2.wav?v=music2';
const MUSIC_VOLUME=.18;
let musicBuffer=null,musicLoad=null,musicGain=null,musicOffset=0,musicStartedAt=0;
function musicWanted(){return audioPrefs.music&&!document.hidden&&audioCtx&&audioCtx.state==='running'}
function stopMusic(){
 if(!musicLoop)return;
 const source=musicLoop,gain=musicGain;
 if(musicBuffer)musicOffset=(musicOffset+Math.max(0,audioCtx.currentTime-musicStartedAt))%musicBuffer.duration;
 musicLoop=null;musicGain=null;
 const now=audioCtx.currentTime;
 gain.gain.cancelScheduledValues(now);
 gain.gain.setValueAtTime(gain.gain.value,now);
 gain.gain.linearRampToValueAtTime(0,now+.04);
 source.stop(now+.05);
 source.onended=()=>{source.disconnect();gain.disconnect()};
}
function startMusic(){
 if(!musicWanted()||musicLoop||!musicBuffer)return;
 const source=audioCtx.createBufferSource(),gain=audioCtx.createGain();
 source.buffer=musicBuffer;source.loop=true;
 gain.gain.setValueAtTime(0,audioCtx.currentTime);
 gain.gain.linearRampToValueAtTime(MUSIC_VOLUME,audioCtx.currentTime+.12);
 source.connect(gain);gain.connect(audioCtx.destination);
 musicStartedAt=audioCtx.currentTime;
 source.start(musicStartedAt,musicOffset%musicBuffer.duration);
 musicLoop=source;musicGain=gain;
}
function syncMusic(){
 if(!musicWanted()){stopMusic();return}
 if(musicLoop)return;
 if(musicBuffer){startMusic();return}
 // Share one request while loading. Re-check preferences before starting so a
 // slow response cannot start music after it was switched off or hidden.
 if(musicLoad)return;
 musicLoad=fetch(MUSIC_URL).then(response=>{
  if(!response.ok)throw Error('Music file returned HTTP '+response.status);
  return response.arrayBuffer();
 }).then(data=>audioCtx.decodeAudioData(data)).then(buffer=>{
  musicBuffer=buffer;musicLoad=null;startMusic();
 }).catch(error=>{
  musicLoad=null;
  console.warn('Background music unavailable:',error.message);
  const status=document.getElementById('audioStatus');
  if(status&&audioPrefs.music)status.textContent='Music could not load. Switch music off and on to retry. Sound effects are still available.';
 });
}

function setAudioPref(kind,enabled){audioPrefs[kind]=Boolean(enabled);
 try{localStorage.setItem(AUDIO_KEY,JSON.stringify(audioPrefs))}catch(e){}
 if(enabled)ensureAudio();syncMusic();
 const status=document.getElementById('audioStatus');if(status)status.textContent='Your sound preferences are saved on this device.';
}
// Browsers require a user gesture before audio may play. Never autoplay on load.
document.addEventListener('click',e=>{
 if(!e.target.closest('button'))return;
 const first=!audioCtx;ensureAudio();if(first)syncMusic();
 const label=(e.target.closest('button').textContent||'').toLowerCase();
 if(label.includes('reveal')||label.includes('unmask')||label.includes('next bluff'))effect('reveal');
 else if(label.includes('winner')||label.includes('results'))effect('win');
 else if(label.includes('lock in'))effect('lock');
 else effect('tap');
},true);
document.addEventListener('visibilitychange',syncMusic);
window.addEventListener('pagehide',stopMusic);
window.addEventListener('pageshow',syncMusic);
function audioSettingsHtml(){return `<div class="audio-settings"><h3>🎵 Sound & music</h3><label class="audio-toggle"><span>Background music</span><input type="checkbox" ${audioPrefs.music?'checked':''} onchange="setAudioPref('music',this.checked)"></label><label class="audio-toggle"><span>Sound effects</span><input type="checkbox" ${audioPrefs.effects?'checked':''} onchange="setAudioPref('effects',this.checked)"></label><p id="audioStatus" class="help">Music starts after your first tap. Settings are remembered on this device.</p></div>`}

const oldHome=home;
home=function(){oldHome();const card=document.querySelector('.card');if(card){card.insertAdjacentHTML('beforeend','<button class="btn pink" onclick="showPremium()">👑 PREMIUM — £3.99 PREVIEW</button><button class="btn secondary" onclick="showAbout()">⚙️ SETTINGS & PRIVACY</button>');}}
const oldRender=render;
render=function(){oldRender();saveSession();};
if(recoverSession())render();else render();
</script></body></html>
