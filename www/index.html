}

function makeDeck(pool,count){const groups=new Map();for(const q of shuffle(pool)){const key=categoryGroup(q[0]);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(q)}const deck=[];while(deck.length<count&&groups.size){for(const key of shuffle([...groups.keys()])){if(deck.length>=count)break;const group=groups.get(key);deck.push(group.pop());if(!group.length)groups.delete(key)}}return deck}

 case 'setup':shell(`<section class="card"><span class="tag">ASSEMBLE YOUR SUSPECTS</span><h1 class="hero">Who’s bringing<br><span class="accent">the nonsense?</span></h1><p class="subtitle">3–10 players. Names, nicknames or entirely unconvincing aliases.</p>${s.players.map((p,i)=>`<div class="row player"><span aria-hidden="true"><img class="mask-inline" src="${MASK_URL}" alt="" width="23" height="23"></span><input aria-label="Player ${i+1} name" class="input" maxlength="24" value="${esc(p)}" oninput="updatePlayer(${i},this.value)"><button type="button" class="btn secondary small" aria-label="Remove player ${i+1}" onclick="removePlayer(${i})" ${s.players.length<=3?'disabled':''}>✕</button></div>`).join('')}<button class="btn secondary" onclick="addPlayer()" ${s.players.length>=10?'disabled':''}>+ ADD A BLUFFER</button><fieldset class="mode-picker"><legend>Choose your question mode</legend>${[['kids','Kids','Gentler questions. Wild imaginations.',JUNIOR_BANK.length],['classic','Classic','The full mixed bag. Bring your poker face.',FREE_QUESTIONS]].map(([value,label,detail,count])=>`<label class="mode-choice"><input type="radio" name="questionMode" value="${value}" ${s.mode===value?'checked':''} onchange="setGameSetting('mode',this.value)"><span><strong>${label}</strong><small>${detail}<br>${count} free questions</small></span></label>`).join('')}</fieldset><details class="setup-ages"><summary>Player ages & Little Bluffer Help</summary><p class="help">Ages only control optional hints for under-10s. Your chosen Kids or Classic mode controls the questions.</p><div class="age-grid">${s.players.map((p,i)=>`<label class="age-item">${esc(p)}<select class="input" aria-label="Age for ${esc(p)}" onchange="updateAge(${i},this.value)">${[7,8,9,10,11,12,13,14,16,18,25,35,45,60].map(n=>`<option value="${n}" ${Number(s.ages[i]||10)===n?'selected':''}>${n}${n===60?'+':''}</option>`).join('')}</select></label>`).join('')}</div></details><label class="setup-label">Answer time limit<select class="input" onchange="setGameSetting('timerSeconds',Number(this.value))">${[[0,'Off — let the nonsense breathe'],[30,'30 seconds'],[60,'60 seconds'],[90,'90 seconds'],[120,'2 minutes']].map(([v,l])=>`<option value="${v}" ${s.timerSeconds===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="setup-label">Number of rounds<select class="input" onchange="setGameSetting('rounds',Number(this.value))">${[5,10,15].map(n=>`<option value="${n}" ${n===s.rounds?'selected':''}>${n} rounds</option>`).join('')}</select></label><div class="error" role="alert">${esc(s.error)}</div><button class="btn" onclick="start()">LET THE TALL TALES BEGIN →</button></section>`);break;
 case 'question':shell(`<section class="card question-preview">${questionChangeButton()}<span class="tag">ROUND ${s.round+1} · ${esc(s.current[0])} · ${s.mode==='kids'?'KIDS':'CLASSIC'}</span><h1>Your question</h1><div class="question">${esc(s.current[1])}</div><button class="btn" onclick="beginBluffing()">LET’S BLUFF →</button></section>`);break;
 case 'handoff':shell(`<section class="card"><span class="tag">${s.stage==='answer'?'SECRET BLUFF':'SECRET VOTE'}</span><div class="emoji" aria-hidden="true">📱</div><h1 class="hero">Over to<br><span class="accent">${esc(s.players[s.turn])}.</span></h1><p class="subtitle">${s.stage==='answer'?'Everyone else: eyes elsewhere. Genius needs privacy. So does nonsense.':'One private vote. An entirely public reckoning later.'}</p><div class="progress">${s.players.map((_,i)=>`<span class="${i<s.turn?'done':''}"></span>`).join('')}</div><button class="btn" onclick="${s.stage==='answer'?'startAnswer()':'startVote()'}">I’M ${esc(s.players[s.turn]).toUpperCase()} — NO PEEKING →</button></section>`);break;
 case 'answer':shell(`<section class="card"><span class="tag">${esc(s.current[0])} · BLUFFER ${s.turn+1}/${s.players.length}</span><div class="question">${esc(s.current[1])}</div><p class="subtitle">${esc(s.players[s.turn])}, give us something wonderfully plausible.</p>${s.timerSeconds&&(s.deadline||s.timerExpired)?`<div id="answerTimer" class="pill answer-timer">⏱ <span>Time remaining:</span> <span id="timeLeft">${s.deadline?Math.max(0,Math.ceil((s.deadline-Date.now())/1000))+'s':"Time’s up!"}</span></div>`:''}<div id="lastSeconds" class="last-seconds" hidden aria-hidden="true"><small>Seconds left</small><strong id="lastSecondsNumber"></strong></div>${isLittleBluffer()?`<button type="button" class="btn secondary" onclick="toggleHint()">💡 ${s.hintOpen?'HIDE HELP':'LITTLE BLUFFER HELP'}</button>${s.hintOpen?`<div class="hintbox"><strong>A little nudge…</strong><p>${esc(s.current[4]||'Invent something that sounds like it could be true.')}</p><small>Your imagination does the rest. The real answer stays secret.</small></div>`:''}`:''}<form onsubmit="event.preventDefault();answerSubmit()"><input id="answer" class="input" autocomplete="off" autocapitalize="sentences" maxlength="110" placeholder="Your finest piece of fiction…" aria-label="Your fake answer"><div id="err" class="error" role="alert"></div><button type="submit" class="btn">LOCK IN MY BLUFF 🔒</button><button type="button" id="skipAnswer" class="btn secondary" ${s.timerExpired?'':'hidden'} onclick="skipAnswer()">SKIP THIS ANSWER</button></form><p class="help">Once locked in, your bluff is hidden. Keep that face innocent.</p></section>`);break;
 case 'voteIntro':shell(`<section class="card"><div class="emoji" aria-hidden="true">🗳️</div><h1 class="hero">A pack of lies.<br><span class="accent">One awkward truth.</span></h1><p class="subtitle">${s.players.length} bluffs and one real answer have been shuffled together. Each player votes in secret. Trust your instincts. Or someone’s excellent nonsense.</p><p class="voteinfo">You can’t vote for your own bluff. That would be admiring the merchandise.</p><button class="btn" onclick="startVoting()">TIME TO PICK A SIDE →</button></section>`);break;
 case 'vote':shell(`<section class="card"><span class="tag">${esc(s.current[0])} · VOTER ${s.turn+1}/${s.players.length}</span><div class="question">${esc(s.current[1])}</div><p class="subtitle">${esc(s.players[s.turn])}, which answer has the least fiction in it?</p>${s.options.map((o,i)=>`<button class="option ${s.selected===i?'selected':''}" onclick="state.selected=${i};state.error='';render()" ${o.owner===s.turn?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(votingText(o.text))}${o.owner===s.turn?' <small>(your handiwork)</small>':''}</span></button>`).join('')}<div class="error" role="alert">${esc(s.error)}</div><button class="btn" onclick="voteSubmit()" ${s.selected<0?'disabled':''}>LOCK IN MY VOTE 🔒</button></section>`);break;
 case 'reveal':renderReveal();break;
 case 'scores':shell(`<section class="card"><span class="tag">THE NUMBERS DON’T BLUFF</span><h1 class="hero">The overall<br><span class="accent">scoreboard.</span></h1>${s.players.map((p,i)=>({p,i,score:s.scores[i]})).sort((a,b)=>b.score-a.score).map((x,rank)=>`<div class="score"><span>${['🥇','🥈','🥉'][rank]||'⭐'} ${esc(x.p)}</span><strong>${x.score}</strong></div>`).join('')}<button class="btn" onclick="advance()">${s.round+1===s.rounds?'CROWN THE CHAMPION →':'ANOTHER ROUND OF NONSENSE →'}</button></section>`);break;
 case 'final':{const max=Math.max(...s.scores),winners=s.players.filter((p,i)=>s.scores[i]===max);shell(`<section class="card"><div class="emoji" aria-hidden="true">🏆<img class="mask-inline" src="${MASK_URL}" alt="" width="23" height="23"></div><span class="tag">THE BLUFF STOPS HERE</span><h1 class="hero">${winners.length>1?'A shared throne.':'All hail the'}<br><span class="accent">${winners.length>1?'Double the nerve.':'chief of disbelief.'}</span></h1><div class="winner">${winners.map(esc).join(' & ')}<br><span class="counter">${max} ${max===1?'point':'points'}</span></div><p class="subtitle">${winners.length>1?'Equally convincing. Equally untrustworthy. We mean that affectionately.':'A thoroughly questionable performance. A thoroughly deserved victory.'}</p>${s.players.map((p,i)=>({p,i,score:s.scores[i]})).sort((a,b)=>b.score-a.score).map((x,rank)=>`<div class="score"><span>${competitionRank(x.score,s.scores)}. ${esc(x.p)}</span><strong>${x.score}</strong></div>`).join('')}<button class="btn" onclick="setup()">DEMAND A REMATCH →</button><button class="btn secondary" onclick="clearActiveGame()">HOME</button></section>`);break}
}}
function saveSession(){try{const snapshot={...state,experienceVersion:53,selected:-1};if(snapshot.screen==='reveal'&&snapshot.revealPhase==='running')snapshot.revealPhase='paused';if(['answer','vote'].includes(snapshot.screen)){snapshot.screen='handoff';snapshot.deadline=null}localStorage.setItem(SAVE_KEY,JSON.stringify(snapshot))}catch(e){console.warn('Local session storage unavailable',e)}}
function recoverSession(){try{
 const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!saved||!Array.isArray(saved.players)||!Array.isArray(saved.scores)||!['question','handoff','voteIntro','reveal','scores','final'].includes(saved.screen))return false;
 if(saved.players.length<3||saved.players.length>10||saved.scores.length!==saved.players.length||!Array.isArray(saved.ages)||saved.ages.length!==saved.players.length||!Array.isArray(saved.deck))return false;
 const mode=['kids','classic'].includes(saved.mode)?saved.mode:saved.mode==='junior'||saved.mode==='auto'&&Math.min(...saved.ages)<10?'kids':'classic';
 state={...freshState(),...saved,experienceVersion:53,mode,selected:-1,deadline:null};
 if(!Array.isArray(state.seenQuestionIds))state.seenQuestionIds=[];
 state.seenQuestionIds=[...new Set([...state.seenQuestionIds,...state.deck.slice(0,state.round+1).map(q=>q[5])])];
 if(['reveal','scores','final'].includes(state.screen))state.hasScored=true;
 if(state.screen==='reveal'){
  if(!Array.isArray(state.options)||!Array.isArray(state.votes)||state.votes.length!==state.players.length||state.votes.some(v=>!state.options[v]))throw Error('Invalid saved reveal');
  if(state.options.length!==state.players.length+1||new Set(state.options.map(o=>o.owner)).size!==state.options.length||state.options.some(o=>typeof o.text!=='string'||!Number.isInteger(o.owner)||o.owner< -1||o.owner>=state.players.length))throw Error('Invalid saved options');
  if(!Array.isArray(state.gains)||state.gains.length!==state.players.length)throw Error('Invalid saved points');
  if(saved.experienceVersion!==53){state.revealStep=0;state.revealPhase='ready';state.revealElapsed=0;state.roundBaseScores=state.scores.map((n,i)=>n-state.gains[i]);}
  if(!Number.isInteger(state.revealStep)||state.revealStep<0||state.revealStep>state.players.length+2)state.revealStep=0;
  if(!Array.isArray(state.roundBaseScores)||state.roundBaseScores.length!==state.players.length)state.roundBaseScores=state.scores.map((n,i)=>n-state.gains[i]);
  if(state.revealStep===0){state.revealPhase='ready';state.revealElapsed=0;}
  else{state.revealElapsed=Math.max(0,Math.min(revealScene().duration,Number(state.revealElapsed)||0));if(state.revealPhase!=='finished')state.revealPhase='paused';if(state.revealElapsed>=revealScene().duration)state.revealPhase='finished';}
 }
 return true;
}catch(e){state=freshState();return false}}
function showPremium(){openGameDialog('premiumDialog','A little more bluff?',`<p class="subtitle">Premium is planned as a one-off £3.99 unlock with more questions. For now, this is a preview: no purchase or restoration is available, and no payments are taken.</p><button class="btn" data-dialog-action="cancel" autofocus>BACK TO THE GOOD STUFF</button>`,'premium')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame('hidden');else resumeGame('hidden')});

// BLUFFLE! audio: synthesized effects plus the approved bundled music loop.
const AUDIO_KEY='bluffle_audio_v1';
let audioPrefs={music:true,effects:true};
try{audioPrefs={...audioPrefs,...JSON.parse(localStorage.getItem(AUDIO_KEY)||'{}')}}catch(e){}
let audioCtx=null,musicLoop=null;
function ensureAudio(){
 try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=new C();audioCtx.addEventListener('statechange',syncMusic)}
 if(audioCtx.state==='suspended')audioCtx.resume().then(syncMusic).catch(()=>{});
 else syncMusic();
 }catch(e){console.warn('Audio unavailable',e)}
}
function tone(freq,duration=0.14,type='sine',volume=.06,delay=0){
 if(!audioCtx||audioCtx.state!=='running')return;
 const t=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);
 gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.015);
 gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
 osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+duration+.02);
}
function effect(name){if(!audioPrefs.effects)return;ensureAudio();
 if(name==='tap')tone(560,.065,'sine',.025);
 if(name==='lock'){tone(470,.11,'triangle',.07);tone(700,.14,'triangle',.06,.1)}
 if(name==='reveal'){[392,494,587,784].forEach((f,i)=>tone(f,.28,'triangle',.075,i*.105))}
 if(name==='win'){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.085,i*.15))}
 if(name==='handoff'){tone(440,.09,'sine',.035);tone(330,.12,'sine',.03,.1)}
}
// BLUFFLE! approved 108 BPM arrangement; bundled locally for website and iOS.
const MUSIC_URL='assets/music/bluffle-enhanced-v2.wav?v=music2';
const MUSIC_VOLUME=.18;
let musicBuffer=null,musicLoad=null,musicGain=null,musicOffset=0,musicStartedAt=0;
function musicWanted(){return audioPrefs.music&&!document.hidden&&audioCtx&&audioCtx.state==='running'}
function stopMusic(){
 if(!musicLoop)return;
 const source=musicLoop,gain=musicGain;
 if(musicBuffer)musicOffset=(musicOffset+Math.max(0,audioCtx.currentTime-musicStartedAt))%musicBuffer.duration;
 musicLoop=null;musicGain=null;
 const now=audioCtx.currentTime;
 gain.gain.cancelScheduledValues(now);
 gain.gain.setValueAtTime(gain.gain.value,now);
 gain.gain.linearRampToValueAtTime(0,now+.04);
 source.stop(now+.05);
 source.onended=()=>{source.disconnect();gain.disconnect()};
}
function startMusic(){
 if(!musicWanted()||musicLoop||!musicBuffer)return;
 const source=audioCtx.createBufferSource(),gain=audioCtx.createGain();
 source.buffer=musicBuffer;source.loop=true;
 gain.gain.setValueAtTime(0,audioCtx.currentTime);
 gain.gain.linearRampToValueAtTime(currentMusicVolume(),audioCtx.currentTime+.12);
 source.connect(gain);gain.connect(audioCtx.destination);
 musicStartedAt=audioCtx.currentTime;
 source.start(musicStartedAt,musicOffset%musicBuffer.duration);
 musicLoop=source;musicGain=gain;
}
function syncMusic(){
 if(!musicWanted()){stopMusic();return}
 if(musicLoop)return;
 if(musicBuffer){startMusic();return}
 // Share one request while loading. Re-check preferences before starting so a
 // slow response cannot start music after it was switched off or hidden.
 if(musicLoad)return;
 musicLoad=fetch(MUSIC_URL).then(response=>{
  if(!response.ok)throw Error('Music file returned HTTP '+response.status);
  return response.arrayBuffer();
 }).then(data=>audioCtx.decodeAudioData(data)).then(buffer=>{
  musicBuffer=buffer;musicLoad=null;startMusic();
 }).catch(error=>{
  musicLoad=null;
  console.warn('Background music unavailable:',error.message);
  const status=document.getElementById('audioStatus');
  if(status&&audioPrefs.music)status.textContent='Music could not load. Switch music off and on to retry. Sound effects are still available.';
 });
}

function setAudioPref(kind,enabled){audioPrefs[kind]=Boolean(enabled);
 try{localStorage.setItem(AUDIO_KEY,JSON.stringify(audioPrefs))}catch(e){}
 if(enabled)ensureAudio();syncMusic();
 const status=document.getElementById('audioStatus');if(status)status.textContent='Your sound preferences are saved on this device.';
}
// Browsers require a user gesture before audio may play. Never autoplay on load.
document.addEventListener('click',e=>{
 if(!e.target.closest('button'))return;
 const first=!audioCtx;ensureAudio();if(first)syncMusic();
 if(e.target.closest('[data-reveal-control]'))return;
 const label=(e.target.closest('button').textContent||'').toLowerCase();
 if(label.includes('reveal')||label.includes('unmask')||label.includes('next bluff'))effect('reveal');
 else if(label.includes('winner')||label.includes('results'))effect('win');
 else if(label.includes('lock in'))effect('lock');
 else effect('tap');
},true);
document.addEventListener('visibilitychange',syncMusic);
window.addEventListener('pagehide',stopMusic);
window.addEventListener('pageshow',syncMusic);
function audioSettingsHtml(){return `<div class="audio-settings"><h3>🎵 Sound & music</h3><label class="audio-toggle"><span>Background music</span><input type="checkbox" ${audioPrefs.music?'checked':''} onchange="setAudioPref('music',this.checked)"></label><label class="audio-toggle"><span>Sound effects</span><input type="checkbox" ${audioPrefs.effects?'checked':''} onchange="setAudioPref('effects',this.checked)"></label><p id="audioStatus" class="help">Music starts after your first tap. Settings are remembered on this device.</p></div>`}

recoverSession();render();
</script></body></html>
