function categoryGroup(category){const key=String(category).toLowerCase();if(['animals','animal oddities'].includes(key))return 'animals';if(['odd words','weird words'].includes(key))return 'words';if(['geography','weird geography','strange places'].includes(key))return 'places';if(['films','film lines'].includes(key))return 'films';if(['books','autobiographies','first words of books','book endings'].includes(key))return 'books';if(['science','space'].includes(key))return 'science';return key}

function start(){

}
function nextRound(){

function resetRound(){state.answers=Array(state.players.length).fill('');state.votes=Array(state.players.length).fill(-1);state.options=[];state.gains=state.players.map(()=>0);state.hasScored=false;state.roundBaseScores=[...state.scores];state.revealElapsed=0;state.turn=0;state.selected=-1;state.stage='answer';state.error='';state.deadline=null;state.timerExpired=false;state.hintOpen=false;state.revealStep=0;state.revealPhase='ready';state.revealCountdown=3}

function canChangeQuestion(){return state.screen==='question'&&state.stage==='answer'&&!state.answers.some(Boolean)&&state.votes.every(v=>v<0)}

function questionChangeButton(){if(!canChangeQuestion())return '';const available=replacementQuestions().length>0;return `<div class="question-tools"><button type="button" class="question-change" onclick="requestQuestionChange()" ${available?'':'disabled'}>↻ ${available?'Change question':'No unused questions left'}</button></div>`}

function changeQuestion(){

 const available=replacementQuestions();if(!available.length)return false;
 const different=available.filter(q=>categoryGroup(q[0])!==categoryGroup(state.current[0]));
 const next=makeDeck(different.length?different:available,1)[0];
 clearInterval(timerHandle);timerHandle=null;clearRevealTimer();state.current=next;state.deck[state.round]=next;state.seenQuestionIds=[...new Set([...(state.seenQuestionIds||[]),next[5]])];resetRound();state.screen='question';render();return true;

function updateCountdown(left){const timer=$('answerTimer'),clock=$('timeLeft'),cue=$('lastSeconds'),number=$('lastSecondsNumber');if(clock)clock.textContent=left+'s';if(timer)timer.classList.toggle('urgent',left>0&&left<=10);if(cue){cue.hidden=!(left>0&&left<=10);if(number)number.textContent=String(left)}}

 const update=()=>{if(state.screen!=='answer'||!state.deadline){clearInterval(timerHandle);timerHandle=null;updateCountdown(0);return}const left=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));updateCountdown(left);if(left===0){clearInterval(timerHandle);timerHandle=null;state.deadline=null;state.timerExpired=true;const field=$('answer');if(field&&field.value.trim().length>=2)answerSubmit();if(state.screen==='answer'){const err=$('err'),skip=$('skipAnswer'),clock=$('timeLeft');if(clock)clock.textContent="Time's up!";if(err)err.textContent=err.textContent?'Time is up! '+err.textContent:'Time is up! Land your bluff or choose Skip.';if(skip)skip.hidden=false;saveSession()}}};

}
function skipAnswer(){const field=$('answer');if(!field)return;let bluff='An entirely respectable mystery '+(state.turn+1);while(state.answers.some(a=>a.toLowerCase()===bluff.toLowerCase()))bluff+='!';field.value=bluff;answerSubmit()}

 if(val.toLowerCase().replace(/[^a-z0-9]/g,'')===state.current[2].toLowerCase().replace(/[^a-z0-9]/g,'')){$('err').textContent='That is the actual answer! We need your finest fiction.';return}
 if(state.answers.some(a=>a.toLowerCase()===val.toLowerCase())){$('err').textContent='Someone has already submitted that answer. Great minds… try another.';return}
 clearInterval(timerHandle);timerHandle=null;state.deadline=null;state.answers[state.turn]=val;state.turn++;
 if(state.turn>=state.players.length){state.screen='voteIntro';state.options=shuffle([...state.answers.map((text,owner)=>({text,owner})),{text:state.current[2],owner:-1}]);state.turn=0}else state.screen='handoff';render();
}
function startVoting(){if(state.screen!=='voteIntro')return;state.stage='vote';state.screen='handoff';state.turn=0;render()}

function voteSubmit(){

 const option=state.options[state.selected];if(option.owner===state.turn){state.error='Admire your own work. Vote for somebody else’s.';render();return}

 if(state.turn>=state.players.length){calculate();state.screen='reveal';state.revealStep=0;state.revealPhase='ready';state.revealElapsed=0}else state.screen='handoff';render();

function calculate(){if(state.hasScored)return;state.roundBaseScores=[...state.scores];state.gains=state.players.map(()=>0);state.votes.forEach((v,i)=>{const owner=state.options[v].owner;if(owner===-1)state.gains[i]++;else state.gains[owner]++});state.gains.forEach((g,i)=>state.scores[i]+=g);state.hasScored=true;captureRound()}
function votersFor(index){return state.votes.flatMap((v,i)=>v===index?[state.players[i]]:[])}
function revealBluffs(){return state.options.map((o,index)=>({...o,index})).filter(o=>o.owner!==-1).sort((a,b)=>votersFor(a.index).length-votersFor(b.index).length||a.index-b.index)}
function audienceChips(names,empty){return `<div class="reveal-voters">${names.length?names.map(n=>`<span>${esc(n)}</span>`).join(''):`<p class="muted">${empty}</p>`}</div>`}
// Approved reveal: voters first, author second, masks last; truth after all bluffs.
const REVEAL_PACE=.7;
function maskToken(extra='',label='One bluff point'){return `<span class="rx-token rx-mask ${extra}" role="img" aria-label="${esc(label)}"><img src="${MASK_URL}" alt="" width="36" height="36"></span>`}
function truthToken(extra='',label='One truth point'){return `<span class="rx-token rx-tick ${extra}" role="img" aria-label="${esc(label)}">✓</span>`}

function scoreOrder(scores){return scores.map((_,i)=>i).sort((a,b)=>scores[b]-scores[a]||a-b)}
function roundAwards(){

function roundBase(){return state.roundBaseScores?.length===state.players.length?state.roundBaseScores:state.scores.map((n,i)=>n-(state.gains[i]||0))}
function revealTimings(kind,count){

 const authorAt=kind==='truth'?300:Math.max(1950,700+(count-1)*330+700);

}


function revealScene(){

let revealLastTime=null,revealSceneKey='',revealGeometry=null;

}
function resumeGame(reason){
 pauseReasons.delete(reason);if(pauseReasons.size)return;
 const paused=pausedClocks;pausedClocks=null;if(!paused||paused.scene!==sceneKey())return;
 if(paused.answer!==null&&state.screen==='answer'){state.deadline=Date.now()+paused.answer;tickTimer()}

function currentMusicVolume(){return MUSIC_VOLUME*(state.screen==='reveal'&&state.revealPhase==='running'&&!pauseReasons.size ? .4 : 1)}
function restoreMusicLevel(){if(typeof musicGain!=='undefined'&&musicGain&&audioCtx?.state==='running'){const now=audioCtx.currentTime;musicGain.gain.cancelScheduledValues(now);musicGain.gain.setValueAtTime(musicGain.gain.value,now);musicGain.gain.linearRampToValueAtTime(currentMusicVolume(),now+.16)}}
function startUnmasking(){if(state.screen!=='reveal'||state.revealStep!==0||pauseReasons.size)return;state.revealStep=1;beginRevealClip()}
function beginRevealClip(){clearRevealTimer();state.revealElapsed=0;state.revealPhase='running';render();focusReveal();restoreMusicLevel();runRevealAnimation()}
function runRevealAnimation(){
 clearRevealTimer();if(state.screen!=='reveal'||state.revealPhase!=='running'||pauseReasons.size)return;
 const token=revealToken,scene=revealScene();revealLastTime=null;let lastSave=-1000;
 const step=now=>{
  if(token!==revealToken||state.screen!=='reveal'||state.revealPhase!=='running'||pauseReasons.size)return;
  const previous=state.revealElapsed;
  if(revealLastTime!==null)state.revealElapsed=Math.min(scene.duration,previous+Math.max(0,now-revealLastTime)*REVEAL_PACE);
  revealLastTime=now;updateRevealFrame();playRevealCues(scene,previous,state.revealElapsed);
  if(state.revealElapsed>=scene.duration){completeRevealClip();return}
  if(now-lastSave>=1000){lastSave=now;saveSession()}
  revealHandle=requestAnimationFrame(step);
 };
 revealHandle=requestAnimationFrame(step);
}
function playRevealCues(scene,from,to){
 if(!audioPrefs.effects)return;const crossed=t=>from<t&&to>=t;
 if(scene.kind==='bluff'){
  if(!scene.voters.length&&crossed(800))playVocal('wrong');
  scene.voters.forEach((_,i)=>{if(crossed(scene.votersAt+i*scene.voterInterval))playVocal('ha')});
  if(crossed(scene.authorAt))effect('reveal');
  if(scene.voters.length&&crossed(scene.awardAt))playVocal('haha');
 }else if(scene.kind==='truth'){
  if(crossed(scene.authorAt))effect('reveal');
  scene.voters.forEach((_,i)=>{if(crossed(scene.votersAt+i*scene.voterInterval))tone(760,.08,'sine',.035)});
 }else if(scene.kind==='board')scene.awards.forEach((a,i)=>{if(crossed(550+i*620+510)){if(a.type==='mask')playVocal('ha');else tone(880,.1,'triangle',.035)}});

function pauseRevealClip(){if(state.screen!=='reveal'||state.revealPhase!=='running'||pauseReasons.size)return;clearRevealTimer();state.revealPhase='paused';restoreMusicLevel();saveSession();updateRevealControls()}

 let label='CONTINUE THE REVEAL →';if(finished)label=scene.kind==='truth'?(state.round===4?'CROWN THE CHAMPION →':'ADD POINTS TO LEADERBOARD →'):(state.revealStep===state.players.length?'REVEAL THE CORRECT ANSWER →':'NEXT BLUFF →');button.textContent=label;if(skip)skip.hidden=finished;

function revealQuestion(){return `<div class="rx-question"><span class="tag">THE QUESTION</span><p>${esc(state.current[1])}</p></div>`}

function renderReveal(){

  shell(`<section class="card reveal-stage reveal-stage-v53">${revealQuestion()}<img class="rx-intro-mask" src="${MASK_URL}" alt="" width="76" height="76"><span class="tag">EVERYONE, GATHER ROUND</span><h1 class="hero" data-reveal-heading tabindex="-1">The stories are in.</h1><p class="subtitle">Put the screen where everyone can see it. We’ll follow the votes, expose each bluffer, then uncover the truth.</p><button type="button" class="btn" data-reveal-control onclick="startUnmasking()">REVEAL FIRST BLUFF →</button></section>`);return;

function setRevealText(element,text){if(element&&element.textContent!==String(text))element.textContent=String(text)}
function revealReducedMotion(){return window.matchMedia('(prefers-reduced-motion: reduce)').matches}
function updateRevealFrame(){

 const scene=revealScene(),time=Math.max(0,Math.min(scene.duration,state.revealElapsed||0));

 const truth=scene.kind==='truth',data=scene.bluff,flip=$('rxStage').querySelector('.rx-flip'),{votersAt,authorAt,awardAt}=scene,authorShown=time>=authorAt;
 flip.style.transform=authorShown?'rotateY(180deg)':'rotateY(0deg)';
 flip.querySelector('.rx-front').setAttribute('aria-hidden',String(authorShown));flip.querySelector('.rx-back').setAttribute('aria-hidden',String(!authorShown));
 $('rxStage').querySelectorAll('.rx-voter').forEach((v,i)=>{const arrived=time>=votersAt+i*scene.voterInterval;v.classList.toggle('arrived',arrived);v.setAttribute('aria-hidden',String(!arrived))});
 $('rxStage').querySelector('.rx-none')?.classList.toggle('arrived',time>=800);
 const awarded=time>=awardAt,award=$('rxStage').querySelector('.rx-award');award.classList.toggle('arrived',awarded);award.setAttribute('aria-hidden',String(!awarded));
 $('rxStage').querySelectorAll('.rx-award-icons .rx-token').forEach((p,i)=>p.classList.toggle('arrived',time>=awardAt+i*200));
 let text='Take a good look at that answer.';
 if(truth){text=time<scene.authorAt?'The real answer gets the final word.':time<scene.votersAt?'The truth was hiding in plain sight.':!awarded?'These players found the truth.':scene.voters.length?'One green tick and +1 point for each correct voter.':'No truth points this round. Those bluffs did excellent business.'}
 else if(time>=votersAt&&!authorShown)text=scene.voters.length?`${scene.voters.join(' and ')} believed this one. But who sold it?`:'Nobody bought it. But who is owning up to it?';
 else if(authorShown&&!awarded)text=`The bluffer was ${state.players[data.owner]}. A straight face; an entirely invented answer.`;
 else if(awarded)text=scene.voters.length?`One yellow mask per fooled player: ${state.players[data.owner]} earns +${scene.voters.length}.`:'No votes means no masks. Next Bluff when you’re ready.';
 setRevealText($('rxStatus'),text);

function measureRevealBoard(){
 const board=$('rxStage')?.querySelector('.rx-board');if(!board)return;
 const origin=board.getBoundingClientRect();revealGeometry=roundAwards().map((a,i)=>{const from=board.querySelector(`[data-award="${i}"] .rx-token`).getBoundingClientRect(),to=board.querySelector(`[data-player="${a.owner}"] .rx-total`).getBoundingClientRect();return {x0:from.left+from.width/2-origin.left-16,y0:from.top+from.height/2-origin.top-16,x1:to.left+to.width/2-origin.left-16,y1:to.top+to.height/2-origin.top-16}});
}
function updateRevealBoard(scene,time){
 const board=$('rxStage').querySelector('.rx-board');if(!revealGeometry)measureRevealBoard();
 const before=roundBase(),oldOrder=scoreOrder(before),finalOrder=[...oldOrder].sort((a,b)=>state.scores[b]-state.scores[a]||oldOrder.indexOf(a)-oldOrder.indexOf(b));
 const clamp=n=>Math.max(0,Math.min(1,n)),ease=p=>1-Math.pow(1-p,3),motion=revealReducedMotion(),p=clamp((time-scene.gatherEnd)/950),move=motion?(p>0?1:0):ease(p);
 const arrived=scene.awards.filter((_,i)=>time>=550+i*620+510);
 scene.awards.forEach((a,i)=>{
  const start=550+i*620,progress=clamp((time-start)/510),active=time>=start&&progress<1,flight=board.querySelector('.rx-flight-'+i),pos=revealGeometry?.[i];
  board.querySelector(`[data-award="${i}"]`).classList.toggle('spent',time>=start);
  flight.style.display=active&&!motion&&pos?'grid':'none';
  if(active&&pos){const t=ease(progress);flight.style.transform=`translate(${pos.x0+(pos.x1-pos.x0)*t}px,${pos.y0+(pos.y1-pos.y0)*t-50*Math.sin(Math.PI*progress)}px) scale(${1+.16*Math.sin(Math.PI*progress)})`}
 });
 state.players.forEach((_,i)=>{
  const row=board.querySelector(`[data-player="${i}"]`),own=arrived.filter(a=>a.owner===i),old=oldOrder.indexOf(i),next=finalOrder.indexOf(i);
  row.style.transform=`translateY(${(old+(next-old)*move)*76}px)`;setRevealText(row.querySelector('.rx-total'),before[i]+own.length);
  setRevealText(row.querySelector('.rx-rank'),move>.5?competitionRank(state.scores[i],state.scores):competitionRank(before[i],before));
  const earned=row.querySelector('.rx-row-earned'),key=own.map(a=>a.type).join(',');
  if(earned.dataset.points!==key){earned.dataset.points=key;earned.innerHTML=own.map(a=>a.type==='mask'?maskToken('rx-earned-token'):truthToken('rx-earned-token')).join('')}
  row.classList.toggle('rx-leader',move>.5&&state.scores[i]===Math.max(...state.scores));
  const latest=scene.awards.flatMap((a,k)=>a.owner===i&&time>=550+k*620+510?[550+k*620+510]:[]).pop();const burst=latest===undefined?1:clamp((time-latest)/330);
  row.querySelector('.rx-total').style.transform=motion?'none':`scale(${1+.2*Math.sin(Math.PI*burst)})`;
 });
 const result=board.querySelector('.rx-board-result');result.style.opacity=time>=scene.duration?'1':String(clamp((time-scene.gatherEnd-800)/350));
 const leaders=state.players.filter((_,i)=>state.scores[i]===Math.max(...state.scores));setRevealText(result,leaders.length===1?`${leaders[0]} leads on ${Math.max(...state.scores)}.`:`A shared lead: ${leaders.join(' & ')}.`);
 setRevealText($('rxStatus'),time<550?'The masks and ticks you earned are ready to bank.':time<scene.gatherEnd?'Each mask and tick goes to its owner. Every one adds one point.':time<scene.gatherEnd+950?'Now the leaderboard moves into its new order…':'All points banked. The room may now react.');
}

 sfxLoad=Promise.all(Object.entries(VOCAL_CLIPS).map(async([key,b64])=>{const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));sfxBuffers[key]=await audioCtx.decodeAudioData(bytes.buffer)})).catch(()=>{});return sfxLoad;
}
function playVocal(key){
 if(!audioPrefs.effects||document.hidden||pauseReasons.size||!audioCtx||audioCtx.state!=='running')return null;
 const buffer=sfxBuffers[key];if(!buffer){prepareSfx();return null}
 const source=audioCtx.createBufferSource(),gain=audioCtx.createGain();source.buffer=buffer;gain.gain.value=key==='brand'?.85:.7;source.connect(gain);gain.connect(audioCtx.destination);source.onended=()=>{source.disconnect();gain.disconnect()};source.start();return source;
}

async function startStartup(){
 const d=$('startupDialog');if(!d||d.dataset.started)return;d.dataset.started='true';const token=++startupToken;ensureAudio();await prepareSfx();if(token!==startupToken||!$('startupDialog'))return;
 d.querySelector('.startup-ready').hidden=true;d.querySelector('.startup-stage').hidden=false;
 const brand=playVocal('brand');if(brand)startupSources.push(brand);
 const began=performance.now(),reduced=revealReducedMotion();let winked=false;
 const frame=now=>{if(token!==startupToken||!$('startupDialog'))return;const t=now-began,clamp=n=>Math.max(0,Math.min(1,n)),word=clamp(t/300),mask=clamp((t-650)/330);d.querySelector('.startup-word').style.cssText=`opacity:${word};transform:scale(${reduced?1:.7+.3*word}) rotate(${reduced?0:-7+7*word}deg)`;d.querySelector('.startup-mask').style.cssText=`opacity:${mask};transform:translateY(${reduced?0:25*(1-mask)}px)`;d.querySelector('.startup-eye').setAttribute('opacity',!reduced&&t<1360?'1':'0');if(t>=1360&&!winked){winked=true;const wink=playVocal('wink');if(wink)startupSources.push(wink)}if(t>=1950){finishStartup();return}startupFrame=requestAnimationFrame(frame)};
 startupFrame=requestAnimationFrame(frame);
}
function finishStartup(){startupToken++;cancelAnimationFrame(startupFrame);startupFrame=null;startupSources.forEach(s=>{try{s.stop()}catch(e){}});startupSources=[];const d=$('startupDialog');if(d){d.close();d.remove()}startupActive=false;syncMusic()}

// BLUFFLE! audio: synthesized effects plus the approved bundled music loop.
const AUDIO_KEY='bluffle_audio_v1';
let audioPrefs={music:true,effects:true};
try{audioPrefs={...audioPrefs,...JSON.parse(localStorage.getItem(AUDIO_KEY)||'{}')}}catch(e){}
let audioCtx=null,musicLoop=null;
function ensureAudio(){
 try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=new C();audioCtx.addEventListener('statechange',syncMusic)}
 prepareSfx();
 if(audioCtx.state==='suspended')audioCtx.resume().then(syncMusic).catch(()=>{});
 else syncMusic();
 }catch(e){console.warn('Audio unavailable',e)}
}
function tone(freq,duration=0.14,type='sine',volume=.06,delay=0){
 if(!audioCtx||audioCtx.state!=='running')return;
 const t=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);
 gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.015);
 gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
 osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+duration+.02);
}
function effect(name){if(!audioPrefs.effects)return;ensureAudio();
 if(name==='tap')tone(560,.065,'sine',.025);
 if(name==='lock'){tone(470,.11,'triangle',.07);tone(700,.14,'triangle',.06,.1)}
 if(name==='reveal'){[392,494,587,784].forEach((f,i)=>tone(f,.28,'triangle',.075,i*.105))}
 if(name==='win'){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.085,i*.15))}
 if(name==='handoff'){tone(440,.09,'sine',.035);tone(330,.12,'sine',.03,.1)}
}
// BLUFFLE! approved 108 BPM arrangement; bundled locally for website and iOS.
const MUSIC_URL='assets/music/bluffle-enhanced-v2.wav?v=music2';
const MUSIC_VOLUME=.18;
let musicBuffer=null,musicLoad=null,musicGain=null,musicOffset=0,musicStartedAt=0;
function musicWanted(){return audioPrefs.music&&!startupActive&&!document.hidden&&audioCtx&&audioCtx.state==='running'}
function stopMusic(){
 if(!musicLoop)return;
 const source=musicLoop,gain=musicGain;
 if(musicBuffer)musicOffset=(musicOffset+Math.max(0,audioCtx.currentTime-musicStartedAt))%musicBuffer.duration;
 musicLoop=null;musicGain=null;
 const now=audioCtx.currentTime;
 gain.gain.cancelScheduledValues(now);
 gain.gain.setValueAtTime(gain.gain.value,now);
 gain.gain.linearRampToValueAtTime(0,now+.04);
 source.stop(now+.05);
 source.onended=()=>{source.disconnect();gain.disconnect()};
}
function startMusic(){
 if(!musicWanted()||musicLoop||!musicBuffer)return;
 const source=audioCtx.createBufferSource(),gain=audioCtx.createGain();
 source.buffer=musicBuffer;source.loop=true;
 gain.gain.setValueAtTime(0,audioCtx.currentTime);
 gain.gain.linearRampToValueAtTime(currentMusicVolume(),audioCtx.currentTime+.12);
 source.connect(gain);gain.connect(audioCtx.destination);
 musicStartedAt=audioCtx.currentTime;
 source.start(musicStartedAt,musicOffset%musicBuffer.duration);
 musicLoop=source;musicGain=gain;
}
function syncMusic(){
 if(!musicWanted()){stopMusic();return}
 if(musicLoop)return;
 if(musicBuffer){startMusic();return}
 // Share one request while loading. Re-check preferences before starting so a
 // slow response cannot start music after it was switched off or hidden.
 if(musicLoad)return;
 musicLoad=fetch(MUSIC_URL).then(response=>{
  if(!response.ok)throw Error('Music file returned HTTP '+response.status);
  return response.arrayBuffer();
 }).then(data=>audioCtx.decodeAudioData(data)).then(buffer=>{
  musicBuffer=buffer;musicLoad=null;startMusic();
 }).catch(error=>{
  musicLoad=null;
  console.warn('Background music unavailable:',error.message);
  const status=document.getElementById('audioStatus');
  if(status&&audioPrefs.music)status.textContent='Music could not load. Switch music off and on to retry. Sound effects are still available.';
 });
}

function setAudioPref(kind,enabled){audioPrefs[kind]=Boolean(enabled);
 try{localStorage.setItem(AUDIO_KEY,JSON.stringify(audioPrefs))}catch(e){}
 if(enabled)ensureAudio();syncMusic();
 const status=document.getElementById('audioStatus');if(status)status.textContent='Your sound preferences are saved on this device.';
}
// Browsers require a user gesture before audio may play. Never autoplay on load.
document.addEventListener('click',e=>{
 if(!e.target.closest('button')||e.target.closest('#startupDialog'))return;
 const first=!audioCtx;ensureAudio();if(first)syncMusic();
 if(e.target.closest('[data-reveal-control]'))return;
 const label=(e.target.closest('button').textContent||'').toLowerCase();
 if(label.includes('reveal')||label.includes('unmask')||label.includes('next bluff'))effect('reveal');
 else if(label.includes('winner')||label.includes('results'))effect('win');
 else if(label.includes('lock in'))effect('lock');
 else effect('tap');
},true);
document.addEventListener('visibilitychange',syncMusic);
window.addEventListener('pagehide',stopMusic);
window.addEventListener('pageshow',syncMusic);
function audioSettingsHtml(){return `<div class="audio-settings"><h3>🎵 Sound & music</h3><label class="audio-toggle"><span>Background music</span><input type="checkbox" ${audioPrefs.music?'checked':''} onchange="setAudioPref('music',this.checked)"></label><label class="audio-toggle"><span>Sound effects</span><input type="checkbox" ${audioPrefs.effects?'checked':''} onchange="setAudioPref('effects',this.checked)"></label><p id="audioStatus" class="help">Music starts after your first tap. Settings are remembered on this device.</p></div>`}

recoverSession();render();openStartup();
</script></body></html>
